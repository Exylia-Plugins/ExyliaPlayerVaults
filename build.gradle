plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
}

group = 'net.exylia'
version = '1.1.1'

/*
 * ExyliaLib is always the newest one: the latest release on GitHub, or a newer one published to
 * mavenLocal while the library and this plugin change together. The version built against is
 * also the oldest the jar runs on (plugin.yml's exylia-lib), and ExyliaLib keeps itself updated
 * on every server, so building against anything older only hides what a server already has.
 * -PexyliaLibVersion=x.y.z pins one, for a build that has to be reproduced.
 */
def exyliaLibVersion = providers.gradleProperty('exyliaLibVersion').getOrNull() ?: newestExyliaLib()
logger.lifecycle("Building against ExyliaLib ${exyliaLibVersion}")

/** The newest of the latest GitHub release and the newest published to mavenLocal. */
def newestExyliaLib() {
    def candidates = []
    try {
        // The fixed-name asset redirects to the tagged one, which names the version.
        def connection = new URL('https://github.com/DiGround-s/ExyliaLib/releases/latest/download/ExyliaLib.jar').openConnection()
        connection.instanceFollowRedirects = false
        connection.requestMethod = 'HEAD'
        connection.connectTimeout = 10_000
        connection.readTimeout = 10_000
        def tag = (connection.getHeaderField('Location') ?: '') =~ /\/download\/v(\d+\.\d+\.\d+)\//
        if (tag.find()) candidates << tag.group(1)
    } catch (IOException offline) {
        logger.warn("Could not reach GitHub for the latest ExyliaLib: ${offline.message}")
    }
    def local = new File(System.getProperty('user.home'), '.m2/repository/net/exylia/ExyliaLib')
    local.listFiles()?.findAll { it.isDirectory() && it.name ==~ /\d+\.\d+\.\d+/ && new File(it, "ExyliaLib-${it.name}.jar").isFile() }
            ?.each { candidates << it.name }
    if (candidates.isEmpty()) {
        throw new GradleException('No ExyliaLib found: GitHub could not be reached and none is in mavenLocal. '
                + 'Pass -PexyliaLibVersion=x.y.z to build against a known one.')
    }
    return candidates.max { a, b ->
        def x = a.tokenize('.')*.toInteger()
        def y = b.tokenize('.')*.toInteger()
        (0..2).collect { x[it] <=> y[it] }.find { it != 0 } ?: 0
    }
}

repositories {
    // A locally published ExyliaLib wins, so a change to both can be built before the library is released.
    mavenLocal()
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    // ExyliaLib is attached to every release on GitHub; this reads it from there.
    ivy {
        name = 'ExyliaLib releases'
        url = 'https://github.com/DiGround-s/ExyliaLib/releases/download/'
        patternLayout { artifact 'v[revision]/[module]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule('net.exylia', 'ExyliaLib') }
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT'
    // Installed on the server as its own plugin, never shaded: one copy, one cache.
    compileOnly "net.exylia:ExyliaLib:${exyliaLibVersion}"
    compileOnly 'io.github.revxrsal:lamp.common:4.0.0-rc.17'
    compileOnly 'io.github.revxrsal:lamp.bukkit:4.0.0-rc.17'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2:2.2.224'
    testRuntimeOnly 'com.zaxxer:HikariCP:5.1.0'
    testRuntimeOnly 'com.github.ben-manes.caffeine:caffeine:3.2.4'
}

configurations {
    testImplementation.extendsFrom(compileOnly)
}

test {
    useJUnitPlatform()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    options.release.set(21)
}

processResources {
    def props = [version: version, exyliaLibVersion: exyliaLibVersion]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveBaseName.set('ExyliaPlayerVaults')
    archiveClassifier.set('')
    // Set exyliaOutputDir in ~/.gradle/gradle.properties to drop the jar straight into a server.
    if (project.hasProperty('exyliaOutputDir')) {
        destinationDirectory = file("${exyliaOutputDir}/plugins")
    }
    exclude 'META-INF/versions/**'
}

tasks.named('build') {
    dependsOn shadowJar
}

// The plain jar keeps its own name, so build/libs holds one ExyliaPlayerVaults-<version>.jar: the one to install.
jar {
    archiveClassifier.set('plain')
}
