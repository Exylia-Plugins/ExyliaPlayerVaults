# Tresore, in denen das Gesuchte liegt. /pv search <item>, oder der Button in /pv.
#
# Zum Anpassen: Änderungen bleiben bei Updates erhalten.
#
# Werte: %owner_name% %owner_id% %search_query% %search_hits%
# Pro Tresor: %vault_number% %vault_name% %vault_icon% %vault_amount% %vault_owner%

menu-version: 3

title: "{primary}&lSUCHE {letters_black}» {highlight}%search_query% {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Keine weiteren Tresore"
    lore:
      - "{letters_black}Nur Tresore mit Treffer werden gelistet."
    hide_tooltip: false
  custom:
    page_first:
      slots: '30'
      material: GRAY_DYE
      name: "{muted}← Erste Seite"
    page_last:
      slots: '32'
      material: GRAY_DYE
      name: "{muted}Letzte Seite →"

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%vault_icon%"
    name: "{letters}Tresor {letters_black}▸ <gradient:{info}:{info_light}>%vault_name%</gradient> &8[{info}%vault_amount%&8]"
    lore:
      - "{letters_black}Suchergebnis"
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {info}{icon:search} {letters}Enthält{letters_black}: {info}%vault_amount% {letters}von {highlight}%search_query%"
      - ""
      - "{info}{icon:click} Klicken zum Öffnen"
    actions:
      - "exyliaplayervaults:open %vault_owner% %vault_number%"

  navigation:
    previous:
      slot: 30
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Seite {letters_black}▸ <gradient:{error}:{error_light}>← Zurück</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 32
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Seite {letters_black}▸ <gradient:{success}:{success_light}>Weiter →</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Zurück {letters_black}▸ <gradient:{error}:{error_light}>Tresore</gradient>"
    lore:
      - "{error}{icon:click} Klicken zum Zurückgehen"
    actions:
      - "exyliaplayervaults:list %owner_id%"
