    lore:
      - "{letters_black}Vault-Einstellung"
      - ""
      - "{primary}✎ Information"
      - " {letters}Der längste Name, den ein Spieler"
      - " {letters}einem Vault geben darf, vor Rängen."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Länge{letters_black}: %vaults_customization_name_max_length%"
      - "  {letters_black}· {info}{icon:book} {letters}Standard{letters_black}: %vaults_customization_name_max_length_default%"
      - ""
      - "%vaults_customization_name_max_length_click%"
    actions:
      - "exyliaplayervaults:setting vaults customization.name-max-length"

