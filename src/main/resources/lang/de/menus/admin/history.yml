# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Frühere Kopien eines Vaults, die neueste zuerst. /pvadmin history <player> <number>
#
# Werte: %owner_name% %vault_number% %history_size%
# Jede Kopie: %snapshot_id% %snapshot_date% %snapshot_when% %snapshot_cause%
#             %snapshot_actor% %snapshot_used%

title: "{primary}&lVERLAUF {letters_black}» {highlight}%owner_name% #%vault_number% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Keine weiteren Kopien"
    lore:
      - "{letters_black}Bei jeder Änderung wird eine Kopie gespeichert."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Erste Seite"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Letzte Seite →"

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{letters}Kopie {letters_black}▸ <gradient:{primary}:{secondary_light}>%snapshot_when%</gradient> &8[{info}%snapshot_used%&8]"
    lore:
      - "{letters_black}Vault-Kopie"
      - ""
      - "{primary}✎ Information"
      - " {letters}Das war im Vault, bevor er"
      - " {highlight}%snapshot_cause% {letters}von {highlight}%snapshot_actor%{letters} wurde."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Datum{letters_black}: {info}%snapshot_date%"
      - "  {letters_black}· {info}{icon:iron} {letters}Stacks{letters_black}: {info}%snapshot_used%"
      - ""
      - "{primary}{icon:click} Linksklick {letters_black}· {letters}reinschauen"
      - "{error}{icon:right_click} Shift-Rechtsklick {letters_black}· {letters}Kopie zurückspielen"
      - "{letters_black}Du musst es bestätigen."
    actions:
      - "left: exyliaplayervaults:snapshot_view %snapshot_id%"
      - "shift_right: exyliaplayervaults:snapshot_restore %snapshot_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Seite {letters_black}▸ <gradient:{error}:{error_light}>← Zurück</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Seite {letters_black}▸ <gradient:{success}:{success_light}>Weiter →</gradient>"
      lore:
        - "  {letters_black}· {letters}Seite{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: BARREL
    name: "<gradient:{primary}:{secondary_light}>Vault #%vault_number%</gradient>"
    lore:
      - "{letters_black}Vault-Verlauf"
      - ""
      - "{primary}✎ Information"
      - " {letters}Beim Zurückspielen wird der"
      - " {letters}aktuelle Inhalt als neue Kopie gesichert."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {highlight}{icon:tag} {letters}Besitzer{letters_black}: {highlight}%owner_name%"
      - "  {letters_black}· {info}{icon:book} {letters}Kopien{letters_black}: {info}%history_size%"
