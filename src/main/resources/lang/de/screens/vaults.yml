# Words of the vault list screen (screens/vaults.html), one per t="key" there. Colour tokens such as {info} work
# here; keep the %placeholders%. Lines of a tooltip are split by <nl>. Edits show on open screens within seconds.
title: '{highlight}Vaults'
subtitle: '{letters_black}Wird beim Schließen sofort gespeichert · immer nur an einem Ort offen'
own:
  tooltip: '%vault_name%<nl>{letters_black}Belegt {info}%vault_used%{letters_black}/{info}%vault_size%{letters_black} · frei {success}%vault_free%<nl>{primary}Klick {letters_black}· {letters}öffnen<nl>{primary}Rechtsklick {letters_black}· {letters}umbenennen<nl>{primary}<key:key.sprint> + Klick {letters_black}· {letters}Icon ändern'
admin:
  tooltip: '%vault_name%<nl>{letters_black}Belegt {info}%vault_used%{letters_black}/{info}%vault_size%{letters_black} · frei {success}%vault_free%<nl>{primary}Klick {letters_black}· {letters}öffnen<nl>{primary}Rechtsklick {letters_black}· {letters}umbenennen<nl>{primary}<key:key.sprint> + Klick {letters_black}· {letters}Verlauf'
  icon: 'Icon'
  clear: 'Leeren'
