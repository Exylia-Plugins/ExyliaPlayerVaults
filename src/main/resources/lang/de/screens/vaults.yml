owner: '{letters_black}Vault-Besitzer'
unlocked: '{letters}Freigeschaltet'
bought: '{letters}Gekauft'
rows: '{letters}Reihen pro Vault'
search:
  hint: '{letters_black}Welcher Vault enthält ein Item?'
  button: 'Suchen'
nav:
  vaults: 'Vaults'
keys: '{highlight}Klick {letters_black}öffnen   {highlight}Rechtsklick {letters_black}umbenennen   {highlight}<key:key.sprint> {letters_black}Icon'
keys_staff: '{highlight}Klick {letters_black}öffnen   {highlight}Rechtsklick {letters_black}umbenennen   {highlight}<key:key.sprint> {letters_black}Verlauf'
found:
