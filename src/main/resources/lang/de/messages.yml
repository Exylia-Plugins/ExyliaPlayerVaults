prefix: '{primary}&lTRUHEN {letters_black}•<reset>'
title: '{primary}&lTRUHE {letters_black}» {highlight}%name%'
admin-title: '{primary}&lTRUHE {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
view-title: '{primary}&lANSICHT {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
snapshot-title: '{primary}&lKOPIE {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
default-name: '#%number%'
in-use: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Diese Truhe ist gerade woanders geöffnet. Versuch es gleich nochmal.'
not-unlocked: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Du besitzt die Truhe {highlight}%number% {error}nicht.'
unreadable: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Diese Truhe konnte nicht gelesen werden. Es ist nichts verloren gegangen; versuch es nochmal.'
blocked-item: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Dieser Gegenstand kann nicht in einer Truhe gelagert werden.'
lock-lost: '%prefix% {warning}Die Truhe {highlight}%number% {warning}wurde nach einem Verbindungsabbruch gespeichert und geschlossen. {letters}Öffne sie erneut, um weiterzumachen.'
taken-over: '%prefix% {warning}Die Truhe {highlight}%number% {warning}wurde gespeichert und geschlossen, weil ein Teammitglied sie gerade prüft.'
taking-over: '%prefix% {letters}Die Truhe {highlight}%number% {letters}war auf einem anderen Server geöffnet; sie wird gespeichert und geschlossen.'
hidden-stacks: '%prefix% {warning}%count% {letters}Stack(s) dieser Truhe bleiben verborgen, bis sie wieder mehr Reihen hat.'
returned: '%prefix% {warning}%count% {letters}Stack(s) passen nicht mehr in die Truhe {highlight}%number% {letters}und wurden dir zurückgegeben.'
rewards-delivered: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}%amount% {letters}Gegenstand/Gegenstände aus deinen Truhen wurde(n) dir zurückgegeben.'
cooldown: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Warte {highlight}%time% ⌚ {error}, bevor du eine weitere Truhe öffnest.'
in-combat: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Im Kampf kannst du keine Truhe öffnen.'
disabled-world: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}In dieser Welt können Truhen nicht geöffnet werden.'
disabled-game-mode: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}In diesem Spielmodus können Truhen nicht geöffnet werden.'
rename-prompt: '{primary}Name der Truhe %number% {letters_black}(- zum Zurücksetzen)'
name-invalid: '{error}Nur Buchstaben, Zahlen, Leerzeichen und - _ '' . ! ? # ( ).'
renamed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Die Truhe {highlight}%number% {letters}heißt jetzt {highlight}%name%{letters}.'
rename-reset: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Die Truhe {highlight}%number% {letters}hat wieder ihren ursprünglichen Namen.'
icon-prompt: '{primary}Wähle ein Icon für die Truhe %number%'
icon-changed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Die Truhe {highlight}%number% {letters}hat ein neues Icon.'
no-permission: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Dafür hast du keine Berechtigung.'
buy-prompt: '{primary}Truhe %number% für %price% kaufen?'
bought: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}Die Truhe {highlight}%number% {success}gehört dir. {letters}Du hast {highlight}%price% {letters}bezahlt.'
buy-too-poor: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Du brauchst {highlight}%price%{error}, um diese Truhe zu kaufen.'
buy-limit: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Du kannst keine weiteren Truhen kaufen.'
buy-disabled: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Auf diesem Server können keine Truhen gekauft werden.'
buy-failed: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Der Kauf wurde nicht abgeschlossen und dir wurde nichts abgebucht. Versuch es nochmal.'
search-prompt: '{primary}Suche nach einem Gegenstand in den Truhen'
search-none: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Keine deiner Truhen enthält {highlight}%query%{error}.'
admin-usage:
  - '%prefix% {letters}Verwendung{letters_black}:'
  - ' {letters_black}▎ {highlight}/pvadmin list <player>'
  - ' {letters_black}▎ {highlight}/pvadmin view <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin edit <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin history <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin clear <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin reload'
clear-prompt: '{error}Truhe %number% von %player% leeren?'
cleared: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Die Truhe {highlight}%number% {letters}von {highlight}%player% {letters}wurde geleert. {letters_black}Der Inhalt ist im Verlauf gespeichert.'
restore-prompt: '{warning}Truhe %number% von %player% auf den Stand von %when% zurücksetzen?'
restored: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Die Truhe {highlight}%number% {letters}von {highlight}%player% {letters}ist wieder auf dem Stand von {highlight}%when%{letters}.'
history-empty: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Die Truhe {highlight}%number% {error}von {highlight}%player% {error}hat noch keinen Verlauf.'
snapshot-missing: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Diese Kopie ist nicht mehr im Verlauf vorhanden.'
reloaded: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}Konfiguration, Nachrichten und Menüs neu geladen.'
