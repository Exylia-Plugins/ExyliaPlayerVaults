# DÜZENLEME — HER BAŞLANGIÇTA YENİDEN OLUŞTURULUR.
#
# Parayla alınan ek kasalar. Gerisi config.yml içinde.

title: "{primary}&lAYARLAR {letters_black}» {highlight}Satın alma"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: GOLD_INGOT
    name: "<gradient:{primary}:{secondary_light}>Satın alma</gradient>"
    lore:
      - "{letters_black}Satın alma ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Oyuncuların parayla aldığı"
      - " {letters}ek kasalar."

  purchase-enabled:
    slot: 11
    material: EMERALD
    name: "{letters}Satın alma {letters_black}▸ <gradient:{primary}:{secondary_light}>Kasa satın alma</gradient>"
    lore:
      - "{letters_black}Satın alma ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Rütbenin verdiğinden fazla"
      - " {letters}kasa almaya izin verir."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:star} {letters}Satın alma{letters_black}: %purchase_purchase_enabled%"
      - "  {letters_black}· {info}{icon:book} {letters}Varsayılan{letters_black}: %purchase_purchase_enabled_default%"
      - ""
      - "%purchase_purchase_enabled_click%"
    actions:
      - "exyliaplayervaults:setting purchase purchase.enabled"

  purchase-currency:
    slot: 12
    material: SUNFLOWER
    name: "{letters}Satın alma {letters_black}▸ <gradient:{primary}:{secondary_light}>Para birimi</gradient>"
    lore:
