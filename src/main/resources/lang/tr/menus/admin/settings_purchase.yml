      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Kasaların ödendiği para birimi."
      - " {letters}Boşsa varsayılan kullanılır."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:gold} {letters}Para{letters_black}: %purchase_purchase_currency%"
      - "  {letters_black}· {info}{icon:book} {letters}Varsayılan{letters_black}: %purchase_purchase_currency_default%"
      - ""
      - "%purchase_purchase_currency_click%"
