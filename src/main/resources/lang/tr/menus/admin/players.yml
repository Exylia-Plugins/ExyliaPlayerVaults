# DÜZENLEME — HER BAŞLANGIÇTA YENİDEN OLUŞTURULUR.
#
# Bu sunucudaki herkes; her biri kendi kasalarını açar. /pvadmin
#
# Her oyuncu: %player_name% %player_id%

title: "{primary}&lOYUNCU KASALARI {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Başka oyuncu yok"
    lore:
      - "{letters_black}Buradaki çevrimiçi oyuncular burada görünür."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← İlk sayfa"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Son sayfa →"

pagination:
  slots: '0-35'

  item_template:
    material: "playerhead-%player_name%"
    name: "{letters}Oyuncu {letters_black}▸ <gradient:{info}:{info_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Çevrimiçi oyuncu"
      - ""
      - "{info}✎ Bilgi"
      - " {letters}Kasalarından herhangi birine bak,"
      - " {letters}düzenle, boşalt ya da geri yükle."
      - ""
      - "{info}{icon:click} Açmak için tıkla"
    actions:
      - "exyliaplayervaults:list %player_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Sayfa {letters_black}▸ <gradient:{error}:{error_light}>← Önceki</gradient>"
      lore:
        - "  {letters_black}· {letters}Sayfa{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Sayfa {letters_black}▸ <gradient:{success}:{success_light}>Sonraki →</gradient>"
      lore:
        - "  {letters_black}· {letters}Sayfa{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  info:
    slot: 49
    material: COMPASS
    name: "<gradient:{info}:{info_light}>Diğer oyuncular</gradient>"
    lore:
      - "{letters_black}Genel bakış"
      - ""
      - "{info}✎ Bilgi"
      - " {letters}Çevrimdışı ya da başka"
      - " {letters}sunucuda mı? Herkesin"
      - " {letters}kasalarını şununla aç:"
      - " {highlight}/pvadmin list <player>"

  settings:
    slot: 45
    material: COMPARATOR
    name: "{letters}Kasalar {letters_black}▸ <gradient:{primary}:{secondary_light}>Ayarlar</gradient>"
    lore:
      - "{letters_black}Eklenti ayarları"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Eklentinin ayarlarını"
      - " {highlight}dosyalarını {letters}açmadan değiştirin."
      - ""
      - "{primary}{icon:click} Tık {letters_black}· {letters}Ayarları aç"
    actions:
      - "exyliaplayervaults:settings"
