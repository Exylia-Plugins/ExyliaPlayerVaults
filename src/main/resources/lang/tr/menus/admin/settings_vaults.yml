      - ""
      - "%vaults_vaults_blocked_materials_click%"
    actions:
      - "exyliaplayervaults:setting vaults vaults.blocked-materials"

  history-keep:
    slot: 15
    material: CLOCK
    name: "{letters}Kasalar {letters_black}▸ <gradient:{primary}:{secondary_light}>Geçmiş kopyaları</gradient>"
    lore:
      - "{letters_black}Kasalar ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Her kasanın önceki kopyaları,"
      - " {letters}yetkililer geri yükleyebilsin."
      - " {letters}0 hiç tutmaz."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:clock} {letters}Kopya{letters_black}: %vaults_history_keep%"
      - "  {letters_black}· {info}{icon:book} {letters}Varsayılan{letters_black}: %vaults_history_keep_default%"
      - ""
      - "%vaults_history_keep_click%"
    actions:
      - "exyliaplayervaults:setting vaults history.keep"

  customization-name-max-length:
    slot: 16
    material: NAME_TAG
    name: "{letters}Kasalar {letters_black}▸ <gradient:{primary}:{secondary_light}>İsim uzunluğu</gradient>"
    lore:
      - "{letters_black}Kasalar ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Bir oyuncunun kasasına verebileceği"
      - " {letters}en uzun isim."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:book} {letters}Uzunluk{letters_black}: %vaults_customization_name_max_length%"
      - "  {letters_black}· {info}{icon:book} {letters}Varsayılan{letters_black}: %vaults_customization_name_max_length_default%"
      - ""
      - "%vaults_customization_name_max_length_click%"
