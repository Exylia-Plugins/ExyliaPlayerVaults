# DÜZENLEME — HER BAŞLANGIÇTA YENİDEN OLUŞTURULUR.
#
# Bir yöneticinin ayarladığı kasa ayarları. Gerisi config.yml içinde.

title: "{primary}&lAYARLAR {letters_black}» {highlight}Kasalar"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: BARREL
    name: "<gradient:{primary}:{secondary_light}>Kasalar</gradient>"
    lore:
      - "{letters_black}Kasa ayarları"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Bir oyuncunun kaç kasası var,"
      - " {letters}boyutları ve neler tutabilecekleri."

  vaults-default-amount:
    slot: 10
    material: BARREL
    name: "{letters}Kasalar {letters_black}▸ <gradient:{primary}:{secondary_light}>Varsayılan kasa</gradient>"
    lore:
      - "{letters_black}Kasalar ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Kendi izni olmayan bir oyuncunun"
      - " {letters}kaç kasası olduğu."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:hopper} {letters}Kasalar{letters_black}: %vaults_vaults_default_amount%"
      - "  {letters_black}· {info}{icon:book} {letters}Varsayılan{letters_black}: %vaults_vaults_default_amount_default%"
      - ""
      - "%vaults_vaults_default_amount_click%"
    actions:
      - "exyliaplayervaults:setting vaults vaults.default-amount"

  vaults-max-amount:
    slot: 11
    material: CHEST
    name: "{letters}Kasalar {letters_black}▸ <gradient:{primary}:{secondary_light}>Kasa sınırı</gradient>"
    lore:
      - "{letters_black}Kasalar ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Bir oyuncunun sahip olabileceği"
      - " {letters}en çok kasa, alınanlar dahil."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:hopper} {letters}Sınır{letters_black}: %vaults_vaults_max_amount%"
      - "  {letters_black}· {info}{icon:book} {letters}Varsayılan{letters_black}: %vaults_vaults_max_amount_default%"
      - ""
      - "%vaults_vaults_max_amount_click%"
    actions:
      - "exyliaplayervaults:setting vaults vaults.max-amount"

  vaults-default-rows:
    slot: 12
    material: LADDER
    name: "{letters}Kasalar {letters_black}▸ <gradient:{primary}:{secondary_light}>Varsayılan satır</gradient>"
    lore:
      - "{letters_black}Kasalar ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Bir kasanın varsayılan satır"
      - " {letters}sayısı (1 ile 6)."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:book} {letters}Satır{letters_black}: %vaults_vaults_default_rows%"
      - "  {letters_black}· {info}{icon:book} {letters}Varsayılan{letters_black}: %vaults_vaults_default_rows_default%"
      - ""
      - "%vaults_vaults_default_rows_click%"
    actions:
      - "exyliaplayervaults:setting vaults vaults.default-rows"

  vaults-hidden-slots:
    slot: 13
    material: ENDER_CHEST
    name: "{letters}Kasalar {letters_black}▸ <gradient:{primary}:{secondary_light}>Gizli yuvalar</gradient>"
    lore:
      - "{letters_black}Kasalar ayarı"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Küçülen kasanın artık gösteremediği"
      - " {letters}eşyalar: saklanır ya da"
      - " {letters}oyuncuya geri verilir."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:book} {letters}Mod{letters_black}: %vaults_vaults_hidden_slots%"
      - "  {letters_black}· {info}{icon:book} {letters}Varsayılan{letters_black}: %vaults_vaults_hidden_slots_default%"
