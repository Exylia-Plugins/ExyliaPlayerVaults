      - "%vaults_vaults_hidden_slots_click%"
    actions:
      - "exyliaplayervaults:setting vaults vaults.hidden-slots"

  vaults-blocked-materials:
    slot: 14
    material: BARRIER
    name: "{letters}Kasalar {letters_black}▸ <gradient:{primary}:{secondary_light}>Yasaklı eşyalar</gradient>"
    lore:
