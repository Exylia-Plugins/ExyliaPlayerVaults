# DÜZENLEME — HER BAŞLANGIÇTA YENİDEN OLUŞTURULUR.
#
# Bir kasanın önceki kopyaları, en yeniden en eskiye. /pvadmin history <player> <number>
#
# Değerler: %owner_name% %vault_number% %history_size%
# Her kopya: %snapshot_id% %snapshot_date% %snapshot_when% %snapshot_cause%
#            %snapshot_actor% %snapshot_used%

title: "{primary}&lGEÇMİŞ {letters_black}» {highlight}%owner_name% #%vault_number% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Başka kopya yok"
    lore:
      - "{letters_black}Kasa her değiştiğinde bir kopya saklanır."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{letters}Kopya {letters_black}▸ <gradient:{primary}:{secondary_light}>%snapshot_when%</gradient> &8[{info}%snapshot_used%&8]"
    lore:
      - "{letters_black}Kasa kopyası"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Kasanın şu işlemden önceki içeriği:"
      - " {highlight}%snapshot_cause%{letters}, {highlight}%snapshot_actor% {letters}tarafından."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:clock} {letters}Tarih{letters_black}: {info}%snapshot_date%"
      - "  {letters_black}· {info}{icon:iron} {letters}Yığın{letters_black}: {info}%snapshot_used%"
      - ""
      - "{primary}» Sol tık {letters_black}· {letters}içine bak"
      - "{error}» Shift + sağ tık {letters_black}· {letters}bu kopyayı geri yükle"
      - "{letters_black}Onaylaman istenecek."
    actions:
      - "left: exyliaplayervaults:snapshot_view %snapshot_id%"
      - "shift_right: exyliaplayervaults:snapshot_restore %snapshot_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Sayfa {letters_black}▸ <gradient:{error}:{error_light}>← Önceki</gradient>"
      lore:
        - "  {letters_black}· {letters}Sayfa{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Sayfa {letters_black}▸ <gradient:{success}:{success_light}>Sonraki →</gradient>"
      lore:
        - "  {letters_black}· {letters}Sayfa{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: BARREL
    name: "<gradient:{primary}:{secondary_light}>Kasa #%vault_number%</gradient>"
    lore:
      - "{letters_black}Kasa geçmişi"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Bir kopyayı geri yüklemek,"
      - " {letters}mevcut içeriği yeni bir"
      - " {letters}kopya olarak saklar."
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {highlight}{icon:tag} {letters}Sahibi{letters_black}: {highlight}%owner_name%"
      - "  {letters_black}· {info}{icon:book} {letters}Kopya{letters_black}: {info}%history_size%"
