# Kasaların ve bir rütbe ya da satın alımın ekleyeceği kasalar. /pv
#
# Stilini değiştirebilirsin: düzenlemelerin güncellemelerde korunur.
# Düzeni değiştirmesi gereken bir sürüm aşağıdaki menu-version değerini artırır;
# dosya o zaman değiştirilir ve öncekisi yanında saklanır.
#
# Yetkililer aynı ekranı birinin kasalarına /pvadmin list ile açar.
#
# Değerler: %owner_name% %owner_id% %vaults_unlocked% %vaults_max% %vaults_bought% %vaults_rows%
# Her kasa: %vault_number% %vault_name% %vault_icon% %vault_used% %vault_size%
#           %vault_free% %vault_owner% ve satıştaki kasada %vault_price%

menu-version: 3

title: "{primary}&lKASALAR {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Başka kasa yok"
    lore:
      - "{letters_black}Daha yüksek bir rütbe daha fazlasını açar."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← İlk sayfa"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Son sayfa →"

pagination:
  slots: '10-16,19-25,28-34,37-43'

  item_template:
    material: "%vault_icon%"
    name: "{letters}Kasa {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient> &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - "{letters_black}Kasan"
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:iron} {letters}Dolu{letters_black}: {info}%vault_used%{letters_black}/{info}%vault_size%"
      - "  {letters_black}· {success}{icon:check} {letters}Boş{letters_black}: {success}%vault_free%"
      - ""
      - "{primary}{icon:click} Sol tık {letters_black}· {letters}aç"
      - "{primary}{icon:right_click} Sağ tık {letters_black}· {letters}yeniden adlandır"
      - "{primary}{icon:right_click} Shift + sağ tık {letters_black}· {letters}simgeyi değiştir"
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:icon %vault_owner% %vault_number%"

  # Yetkili başkasının kasalarına bakarken: kayıtlı her kasa, yetkili araçlarıyla.
  admin_template:
    material: "%vault_icon%"
    name: "{letters}Kasa {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient> &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - "{letters_black}Oyuncu kasası"
      - ""
      - "{primary}✦ Durum"
      - "  {letters_black}· {info}{icon:iron} {letters}Dolu{letters_black}: {info}%vault_used%{letters_black}/{info}%vault_size%"
      - "  {letters_black}· {success}{icon:check} {letters}Boş{letters_black}: {success}%vault_free%"
      - ""
      - "{primary}{icon:click} Sol tık {letters_black}· {letters}aç"
      - "{primary}{icon:right_click} Sağ tık {letters_black}· {letters}yeniden adlandır"
      - "{primary}{icon:click} Bırak (Q) {letters_black}· {letters}simgeyi değiştir"
      - "{primary}{icon:click} Shift + sol tık {letters_black}· {letters}geçmiş"
      - "{error}{icon:right_click} Shift + sağ tık {letters_black}· {letters}boşalt"
      - "{letters_black}Onaylaman istenecek."
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "drop: exyliaplayervaults:icon %vault_owner% %vault_number%"
      - "shift_left: exyliaplayervaults:history %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:clear %vault_owner% %vault_number%"

  buy_template:
    material: GOLD_INGOT
    name: "{letters}Kasa {letters_black}▸ <gradient:{success}:{success_light}>Satın al #%vault_number%</gradient>"
    lore:
      - "{letters_black}Yeni kasa"
      - ""
      - "{success}✎ Bilgi"
      - " {letters}Bir kasa daha, kalıcı olarak senin."
      - ""
      - "{success}✦ Durum"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Fiyat{letters_black}: {highlight}%vault_price%"
      - ""
      - "{success}{icon:click} Satın almak için tıkla"
    actions:
      - "left: exyliaplayervaults:buy"

  locked_template:
    material: GRAY_DYE
    name: "{letters}Kasa {letters_black}▸ <gradient:{warning}:{warning_light}>#%vault_number%</gradient>"
    lore:
      - "{letters_black}Kilitli kasa"
      - ""
      - "{warning}✎ Bilgi"
      - " {letters}Kilitli."
      - " {letters}Daha yüksek bir rütbe bunu açar."

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Sayfa {letters_black}▸ <gradient:{error}:{error_light}>← Önceki</gradient>"
      lore:
        - "  {letters_black}· {letters}Sayfa{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Sayfa {letters_black}▸ <gradient:{success}:{success_light}>Sonraki →</gradient>"
      lore:
        - "  {letters_black}· {letters}Sayfa{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  search:
    slot: 46
    material: SPYGLASS
    name: "{letters}Kasalar {letters_black}▸ <gradient:{info}:{info_light}>Ara</gradient>"
    lore:
      - "{letters_black}Kasa araması"
      - ""
      - "{info}✎ Bilgi"
      - " {letters}Bir eşyanın hangi kasada olduğunu"
      - " {letters}isim ya da malzemeyle bul; shulker"
      - " {letters}kutuları ve keseler dahil."
      - ""
      - "{info}{icon:click} Aramak için tıkla"
    actions:
      - "exyliaplayervaults:search %owner_id%"

  header:
    slot: 49
    material: "playerhead-%owner_name%"
    name: "<gradient:{info}:{info_light}>%owner_name%</gradient>"
    lore:
      - "{letters_black}Kasaların"
      - ""
      - "{info}✎ Bilgi"
      - " {letters}Bir kasa aynı anda tek bir"
      - " {letters}yerde açılır ve kapattığın"
      - " {letters}anda kaydedilir."
      - ""
      - "{info}✦ Durum"
      - "  {letters_black}· {info}{icon:key} {letters}Açık{letters_black}: {info}%vaults_unlocked%{letters_black}/{info}%vaults_max%"
      - "  {letters_black}· {info}{icon:gold} {letters}Satın alınan{letters_black}: {info}%vaults_bought%"
      - "  {letters_black}· {info}{icon:iron} {letters}Satır{letters_black}: {info}%vaults_rows%"
