# Aranan eşyayı tutan kasalar. /pv search <item> ya da /pv içindeki düğme.
#
# Stili senin: düzenlemelerin güncellemelerde korunur.
#
# Değerler: %owner_name% %owner_id% %search_query% %search_hits%
# Her kasa: %vault_number% %vault_name% %vault_icon% %vault_amount% %vault_owner%

menu-version: 1

title: "{primary}&lARAMA {letters_black}» {highlight}%search_query% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Başka kasa yok"
    lore:
      - ""
      - " {letters_black}▎ {letters}Yalnızca onu tutan kasalar listelenir."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%vault_icon%"
    name: "{primary}&lKASA {highlight}%vault_name% &8[{info}%vault_amount%&8]"
    lore:
      - ""
      - "{secondary}Durum:"
      - " {letters_black}▎ {letters}İçinde {letters_black}» {info}%vault_amount% {letters}adet {highlight}%search_query%"
      - ""
      - "{warning}➥ Açmak için tıkla"
      - ""
    actions:
      - "exyliaplayervaults:open %vault_owner% %vault_number%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← ÖNCEKİ SAYFA"
      lore:
        - ""
        - " {letters_black}▎ {letters}Sayfa {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lSONRAKİ SAYFA →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Sayfa {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
