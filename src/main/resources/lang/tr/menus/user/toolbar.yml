# Bir kasanın altındaki düğme sırası; config.yml'de vaults.toolbar açıkken görünür.
#
# Stilini değiştirebilirsin: değişikliklerin güncellemelerde korunur.
#
# Her düğme sıranın bir sütununda durur (yuva 0-8); düğmesiz sütunlar
# dolgu gösterir. Düğmeler, menü tarzı eylemleri olan sıradan eşyalardır
# (left:, right:, shift_left:...). Bir tık önce kasayı kapatır; tüm eylemleri
# yalnızca başka bir kasa açıyorsa kapatmaz, pencere değişir.
# "previous" ve "next", o yönde kasa yoksa soluk eşyalarını gösterir.
#
# Değerler: %vault_owner% %vault_number% %vault_name% %previous_number%
#         %next_number% %vaults_unlocked%

menu-version: 1

filler:
  material: GRAY_STAINED_GLASS_PANE
  hide_tooltip: true

buttons:
  search:
    slot: 1
    material: SPYGLASS
    name: "{letters}Kasalar {letters_black}▸ <gradient:{info}:{info_light}>Ara</gradient>"
    lore:
      - "{letters_black}Kasa araması"
      - ""
      - "{info}✎ Bilgi"
      - " {letters}Bir eşyanın hangi kasada"
      - " {letters}olduğunu bul; shulker ve çantalar dahil."
      - ""
      - "{info}{icon:click} Aramak için tıkla"
      - "{letters_black}Önce bu kasayı kapatır."
    actions:
      - "exyliaplayervaults:search %vault_owner%"

  previous:
    slot: 3
    sound: "minecraft:item.book.page_turn|1.0|1.0"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
    name: "{letters}Kasa {letters_black}▸ <gradient:{info}:{info_light}>← #%previous_number%</gradient>"
    lore:
      - "  {letters_black}· {letters}Kasa{letters_black}: {info}%vault_number%{letters_black}/{info}%vaults_unlocked%"
      - ""
      - "{info}{icon:click} Açmak için tıkla"
      - "{letters_black}Bu kasayı kaydeder, sonra diğerini açar."
    muted:
      material: GRAY_DYE
      name: "{muted}Önceki kasa yok"
      lore:
        - "{letters_black}Bu ilk kasan."
    actions:
      - "exyliaplayervaults:open %vault_owner% %previous_number%"

  list:
    slot: 4
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Geri {letters_black}▸ <gradient:{error}:{error_light}>Kasalar</gradient>"
    lore:
      - "{error}{icon:click} Geri dönmek için tıkla"
      - "{letters_black}Sahip olduğun tüm kasalar."
    actions:
      - "exyliaplayervaults:list %vault_owner%"

  next:
    slot: 5
    sound: "minecraft:item.book.page_turn|1.0|1.0"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
    name: "{letters}Kasa {letters_black}▸ <gradient:{info}:{info_light}>#%next_number% →</gradient>"
    lore:
      - "  {letters_black}· {letters}Kasa{letters_black}: {info}%vault_number%{letters_black}/{info}%vaults_unlocked%"
      - ""
      - "{info}{icon:click} Açmak için tıkla"
      - "{letters_black}Bu kasayı kaydeder, sonra diğerini açar."
    muted:
      material: GRAY_DYE
      name: "{muted}Sonraki kasa yok"
      lore:
        - "{letters_black}Daha yüksek rütbe daha fazlasını açar."
    actions:
      - "exyliaplayervaults:open %vault_owner% %next_number%"

  customize:
    slot: 7
    material: NAME_TAG
    name: "{letters}Vault {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient>"
    lore:
      - "{letters_black}Kasa görünümü"
      - ""
      - "{primary}✎ Bilgi"
      - " {letters}Bu kasanın listende"
      - " {letters}görünen adı ve simgesi."
      - ""
      - "{primary}{icon:click} Sol tık {letters_black}· {letters}yeniden adlandır"
      - "{primary}{icon:right_click} Sağ tık {letters_black}· {letters}simgeyi değiştir"
      - "{letters_black}Önce bu kasayı kapatır."
    actions:
      - "left: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:icon %vault_owner% %vault_number%"
