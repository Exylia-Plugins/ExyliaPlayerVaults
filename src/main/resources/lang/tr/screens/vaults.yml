  title: 'Henüz kasa yok'
  hint: 'Daha yüksek bir rütbe daha fazlasını açar'
foot: '{letters_black}Her tıklamanın ne yaptığını görmek için bir kasanın üstüne gel'
owner: '{letters_black}Kasa sahibi'
unlocked: '{letters}Açılan'
bought: '{letters}Satın alınan'
rows: '{letters}Her birinde satır'
search:
  hint: '{letters_black}Eşya hangi kasada?'
  button: 'Ara'
