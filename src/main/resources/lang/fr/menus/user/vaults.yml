# Tes coffres, et ceux qu'un grade ou un achat ajouterait. /pv
#
# À toi de le personnaliser : tes modifications sont gardées entre les mises à jour.
# Une version qui doit changer la disposition augmente menu-version ci-dessous ;
# le fichier est alors remplacé et l'ancien est gardé à côté.
#
# Le staff ouvre ce même écran sur les coffres de quelqu'un avec /pvadmin list.
#
# Valeurs : %owner_name% %owner_id% %vaults_unlocked% %vaults_max% %vaults_bought% %vaults_rows%
# Chaque coffre : %vault_number% %vault_name% %vault_icon% %vault_used% %vault_size%
#                 %vault_free% %vault_owner% et, sur celui en vente, %vault_price%

menu-version: 2

title: "{primary}&lCOFFRES {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus de coffres"
    lore:
      - "{letters_black}Un grade supérieur en débloque plus."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%vault_icon%"
    name: "{letters}Coffre {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient> &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - "{letters_black}Ton coffre"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:iron} {letters}Utilisé{letters_black}: {info}%vault_used%{letters_black}/{info}%vault_size%"
      - "  {letters_black}· {success}{icon:check} {letters}Libre{letters_black}: {success}%vault_free%"
      - ""
      - "{primary}» Clic gauche {letters_black}· {letters}ouvrir"
      - "{primary}» Clic droit {letters_black}· {letters}renommer"
      - "{primary}» Shift + clic droit {letters_black}· {letters}changer l'icône"
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:icon %vault_owner% %vault_number%"

  # Le staff qui regarde les coffres de quelqu'un : chaque coffre stocké, avec les outils du staff.
  admin_template:
    material: "%vault_icon%"
    name: "{letters}Coffre {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient> &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - "{letters_black}Coffre du joueur"
      - ""
      - "{primary}✦ Statut"
      - "  {letters_black}· {info}{icon:iron} {letters}Utilisé{letters_black}: {info}%vault_used%{letters_black}/{info}%vault_size%"
      - "  {letters_black}· {success}{icon:check} {letters}Libre{letters_black}: {success}%vault_free%"
      - ""
      - "{primary}» Clic gauche {letters_black}· {letters}ouvrir"
      - "{primary}» Clic droit {letters_black}· {letters}renommer"
      - "{primary}» Jeter (Q) {letters_black}· {letters}changer l'icône"
      - "{primary}» Shift + clic gauche {letters_black}· {letters}historique"
      - "{error}» Shift + clic droit {letters_black}· {letters}vider"
      - "{letters_black}Une confirmation te sera demandée."
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "drop: exyliaplayervaults:icon %vault_owner% %vault_number%"
      - "shift_left: exyliaplayervaults:history %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:clear %vault_owner% %vault_number%"

  buy_template:
    material: GOLD_INGOT
    name: "{letters}Coffre {letters_black}▸ <gradient:{success}:{success_light}>Acheter #%vault_number%</gradient>"
    lore:
      - "{letters_black}Nouveau coffre"
      - ""
      - "{success}✎ Informations"
      - " {letters}Un coffre de plus,"
      - " {letters}à toi pour de bon."
      - ""
      - "{success}✦ Statut"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Prix{letters_black}: {highlight}%vault_price%"
      - ""
      - "{success}» Clique pour acheter"
    actions:
      - "left: exyliaplayervaults:buy"

  locked_template:
    material: GRAY_DYE
    name: "{letters}Coffre {letters_black}▸ <gradient:{warning}:{warning_light}>#%vault_number%</gradient>"
    lore:
      - "{letters_black}Coffre verrouillé"
      - ""
      - "{warning}✎ Informations"
      - " {letters}Verrouillé."
      - " {letters}Un grade supérieur le débloque."

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  search:
    slot: 45
    material: SPYGLASS
    name: "{letters}Coffres {letters_black}▸ <gradient:{info}:{info_light}>Chercher</gradient>"
    lore:
      - "{letters_black}Recherche de coffres"
      - ""
      - "{info}✎ Informations"
      - " {letters}Trouve quel coffre contient un"
      - " {letters}objet, par nom ou matériau, boîtes"
      - " {letters}de shulker et sacs compris."
      - ""
      - "{info}» Clique pour chercher"
    actions:
      - "exyliaplayervaults:search %owner_id%"

  header:
    slot: 49
    material: "playerhead-%owner_name%"
    name: "<gradient:{info}:{info_light}>%owner_name%</gradient>"
    lore:
      - "{letters_black}Tes coffres"
      - ""
      - "{info}✎ Informations"
      - " {letters}Un coffre n'est ouvert qu'à un"
      - " {letters}seul endroit et il est"
      - " {letters}sauvegardé dès que tu le fermes."
      - ""
      - "{info}✦ Statut"
      - "  {letters_black}· {info}{icon:key} {letters}Débloqués{letters_black}: {info}%vaults_unlocked%{letters_black}/{info}%vaults_max%"
      - "  {letters_black}· {info}{icon:gold} {letters}Achetés{letters_black}: {info}%vaults_bought%"
      - "  {letters_black}· {info}{icon:iron} {letters}Lignes{letters_black}: {info}%vaults_rows%"
