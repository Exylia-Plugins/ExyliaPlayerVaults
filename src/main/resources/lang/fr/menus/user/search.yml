# Coffres qui contiennent ce qui a été cherché. /pv search <item>, ou le bouton de /pv.
#
# À toi de le styliser : tes modifications sont conservées entre les mises à jour.
#
# Valeurs : %owner_name% %owner_id% %search_query% %search_hits%
# Chaque coffre : %vault_number% %vault_name% %vault_icon% %vault_amount% %vault_owner%

menu-version: 3

title: "{primary}&lRECHERCHE {letters_black}» {highlight}%search_query% {muted}%current_page%/%total_pages%"
size: 36
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus de coffres"
    lore:
      - "{letters_black}Seuls les coffres qui le contiennent apparaissent."
    hide_tooltip: false
  custom:
    page_first:
      slots: '30'
      material: GRAY_DYE
      name: "{muted}← Première page"
    page_last:
      slots: '32'
      material: GRAY_DYE
      name: "{muted}Dernière page →"

pagination:
  slots: '10-16,19-25'

  item_template:
    material: "%vault_icon%"
    name: "{letters}Coffre {letters_black}▸ <gradient:{info}:{info_light}>%vault_name%</gradient> &8[{info}%vault_amount%&8]"
    lore:
      - "{letters_black}Résultat de recherche"
      - ""
      - "{info}✦ Statut"
      - "  {letters_black}· {info}{icon:search} {letters}Contient{letters_black}: {info}%vault_amount% {letters}de {highlight}%search_query%"
      - ""
      - "{info}{icon:click} Clique pour ouvrir"
    actions:
      - "exyliaplayervaults:open %vault_owner% %vault_number%"

  navigation:
    previous:
      slot: 30
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 32
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  back:
    slot: 31
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>Coffres</gradient>"
    lore:
      - "{error}{icon:click} Clique pour revenir"
    actions:
      - "exyliaplayervaults:list %owner_id%"
