# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Tous les joueurs connectés à ce serveur ; chacun ouvre ses coffres. /pvadmin
#
# Chaque joueur : %player_name% %player_id%

title: "{primary}&lCOFFRES DES JOUEURS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus de joueurs"
    lore:
      - "{letters_black}Les joueurs connectés ici apparaissent ici."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Première page"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Dernière page →"

pagination:
  slots: '0-35'

  item_template:
    material: "playerhead-%player_name%"
    name: "{letters}Joueur {letters_black}▸ <gradient:{info}:{info_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Joueur en ligne"
      - ""
      - "{info}✎ Informations"
      - " {letters}Regarde, modifie, vide ou restaure"
      - " {letters}n'importe lequel de ses coffres."
      - ""
      - "{info}{icon:click} Clique pour ouvrir"
    actions:
      - "exyliaplayervaults:list %player_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Précédente</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Suivante →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  info:
    slot: 49
    material: COMPASS
    name: "<gradient:{info}:{info_light}>Autres joueurs</gradient>"
    lore:
      - "{letters_black}Aperçu"
      - ""
      - "{info}✎ Informations"
      - " {letters}Hors ligne ou sur un autre"
      - " {letters}serveur ? Ouvre les coffres"
      - " {letters}de n'importe qui avec :"
      - " {highlight}/pvadmin list <player>"

  settings:
    slot: 45
    material: COMPARATOR
    name: "{letters}Coffres {letters_black}▸ <gradient:{primary}:{secondary_light}>Réglages</gradient>"
    lore:
      - "{letters_black}Réglages du plugin"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Modifiez les réglages du plugin"
      - " {letters}sans éditer ses {highlight}fichiers{letters}."
      - ""
      - "{primary}{icon:click} Clic {letters_black}· {letters}Ouvrir les réglages"
    actions:
      - "exyliaplayervaults:settings"
