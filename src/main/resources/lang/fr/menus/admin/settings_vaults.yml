# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Les réglages de coffres qu'un admin ajuste. Le reste est dans config.yml.

title: "{primary}&lRÉGLAGES {letters_black}» {highlight}Coffres"
size: 27
type: SIMPLE

open_sounds:
