    slot: 4
    material: BARREL
    name: "<gradient:{primary}:{secondary_light}>Coffres</gradient>"
    lore:
      - "{letters_black}Réglages des coffres"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Combien de coffres a un joueur,"
      - " {letters}leur taille et leur contenu."

  vaults-default-amount:
    slot: 10
    material: BARREL
    name: "{letters}Coffres {letters_black}▸ <gradient:{primary}:{secondary_light}>Coffres de base</gradient>"
    lore:
      - "{letters_black}Réglage : Coffres"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Nombre de coffres d'un joueur"
      - " {letters}sans permission propre."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:hopper} {letters}Coffres{letters_black}: %vaults_vaults_default_amount%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %vaults_vaults_default_amount_default%"
