# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Où et quand un coffre peut être ouvert. Le reste est dans config.yml.

title: "{primary}&lRÉGLAGES {letters_black}» {highlight}Accès"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: IRON_DOOR
    name: "<gradient:{primary}:{secondary_light}>Accès</gradient>"
    lore:
      - "{letters_black}Réglage : Accès"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Où et quand un coffre peut être"
      - " {letters}ouvert, et l'ender chest."

  restrictions-open-cooldown:
    slot: 11
    material: CLOCK
    name: "{letters}Accès {letters_black}▸ <gradient:{primary}:{secondary_light}>Délai d'ouverture</gradient>"
    lore:
      - "{letters_black}Réglage : Accès"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Attente entre l'ouverture de deux"
      - " {letters}coffres. 0 la désactive."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:clock} {letters}Délai{letters_black}: %access_restrictions_open_cooldown%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %access_restrictions_open_cooldown_default%"
      - ""
      - "%access_restrictions_open_cooldown_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.open-cooldown"

  restrictions-block-in-combat:
    slot: 12
    material: IRON_SWORD
    name: "{letters}Accès {letters_black}▸ <gradient:{primary}:{secondary_light}>Bloquer en combat</gradient>"
    lore:
      - "{letters_black}Réglage : Accès"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Refuse d'ouvrir un coffre tant"
      - " {letters}que le joueur est en combat."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:kills} {letters}Blocage{letters_black}: %access_restrictions_block_in_combat%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %access_restrictions_block_in_combat_default%"
      - ""
      - "%access_restrictions_block_in_combat_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.block-in-combat"

  restrictions-disabled-worlds:
    slot: 13
    material: GRASS_BLOCK
    name: "{letters}Accès {letters_black}▸ <gradient:{primary}:{secondary_light}>Mondes désactivés</gradient>"
    lore:
      - "{letters_black}Réglage : Accès"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Mondes où les coffres ne peuvent"
      - " {letters}pas être ouverts, par nom."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:book} {letters}Mondes{letters_black}: %access_restrictions_disabled_worlds%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %access_restrictions_disabled_worlds_default%"
      - ""
      - "%access_restrictions_disabled_worlds_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.disabled-worlds"

  restrictions-disabled-game-modes:
    slot: 14
    material: COMPASS
    name: "{letters}Accès {letters_black}▸ <gradient:{primary}:{secondary_light}>Modes désactivés</gradient>"
    lore:
      - "{letters_black}Réglage : Accès"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Modes de jeu sans coffres,"
      - " {letters}comme SPECTATOR."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:book} {letters}Modes{letters_black}: %access_restrictions_disabled_game_modes%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %access_restrictions_disabled_game_modes_default%"
      - ""
      - "%access_restrictions_disabled_game_modes_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.disabled-game-modes"

  replace-ender-chests:
    slot: 15
    material: ENDER_CHEST
    name: "{letters}Accès {letters_black}▸ <gradient:{primary}:{secondary_light}>Remplacer les ender chests</gradient>"
    lore:
      - "{letters_black}Réglage : Accès"
      - ""
      - "{primary}✎ Informations"
      - " {letters}Ouvre la liste des coffres au lieu"
      - " {letters}de l'ender chest du joueur."
      - ""
      - "{primary}✦ État"
      - "  {letters_black}· {info}{icon:book} {letters}Remplacé{letters_black}: %access_replace_ender_chests%"
      - "  {letters_black}· {info}{icon:book} {letters}Par défaut{letters_black}: %access_replace_ender_chests_default%"
      - ""
      - "%access_replace_ender_chests_click%"
    actions:
      - "exyliaplayervaults:setting access replace-ender-chests"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Retour {letters_black}▸ <gradient:{error}:{error_light}>Réglages</gradient>"
    lore:
      - "{error}{icon:click} Cliquez pour revenir"
    actions:
      - "exyliaplayervaults:settings_hub"
