# NE PAS MODIFIER — RÉGÉNÉRÉ À CHAQUE DÉMARRAGE.
#
# Anciennes copies d'un coffre, de la plus récente à la plus ancienne. /pvadmin history <player> <number>
#
# Valeurs : %owner_name% %vault_number% %history_size%
# Chaque copie : %snapshot_id% %snapshot_date% %snapshot_when% %snapshot_cause%
#                %snapshot_actor% %snapshot_used%

title: "{primary}&lHISTORIQUE {letters_black}» {highlight}%owner_name% #%vault_number% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Plus de copies"
    lore:
      - ""
      - " {letters_black}▎ {letters}Une copie est gardée à chaque changement du coffre."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{primary}&lCOPIE {highlight}%snapshot_when% &8[{info}%snapshot_used%&8]"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Ce que contenait le coffre avant d'être"
      - " {letters_black}▎ {highlight}%snapshot_cause% {letters}par {highlight}%snapshot_actor%{letters}."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Date {letters_black}» {info}%snapshot_date%"
      - " {letters_black}▎ {letters}Piles {letters_black}» {info}%snapshot_used%"
      - ""
      - "{warning}➥ Clic gauche {letters_black}» {letters}voir le contenu"
      - "{error}➥ Shift + clic droit {letters_black}» {letters}restaurer cette copie"
      - " {letters_black}Une confirmation te sera demandée."
      - ""
    actions:
      - "left: exyliaplayervaults:snapshot_view %snapshot_id%"
      - "shift_right: exyliaplayervaults:snapshot_restore %snapshot_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← PAGE PRÉCÉDENTE"
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lPAGE SUIVANTE →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: BARREL
    name: "{primary}&lCOFFRE {highlight}#%vault_number%"
    lore:
      - ""
      - "{secondary}Informations :"
      - " {letters_black}▎ {letters}Propriétaire {letters_black}» {highlight}%owner_name%"
      - " {letters_black}▎ {letters}Restaurer une copie garde le"
      - " {letters_black}▎ {letters}contenu actuel comme nouvelle copie."
      - ""
      - "{secondary}Statut :"
      - " {letters_black}▎ {letters}Copies {letters_black}» {info}%history_size%"
      - ""
