prefix: '{primary}&lCOFFRES {letters_black}•<reset>'
title: '{primary}&lCOFFRE {letters_black}» {highlight}%name%'
admin-title: '{primary}&lCOFFRE {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
view-title: '{primary}&lAPERÇU {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
snapshot-title: '{primary}&lCOPIE {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
default-name: '#%number%'
in-use: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Ce coffre est ouvert ailleurs en ce moment. Réessaie dans un instant.'
not-unlocked: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Tu n''as pas le coffre {highlight}%number%{error}.'
unreadable: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Impossible de lire ce coffre. Rien n''a été perdu ; réessaie.'
blocked-item: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Cet objet ne peut pas aller dans un coffre.'
lock-lost: '%prefix% {warning}Le coffre {highlight}%number% {warning}a été sauvegardé et fermé après une coupure de connexion. {letters}Rouvre-le pour continuer.'
taken-over: '%prefix% {warning}Le coffre {highlight}%number% {warning}a été sauvegardé et fermé car un membre du staff le consulte.'
taking-over: '%prefix% {letters}Le coffre {highlight}%number% {letters}était ouvert sur un autre serveur ; il est sauvegardé puis fermé.'
hidden-stacks: '%prefix% {warning}%count% {letters}pile(s) de ce coffre restent masquées jusqu''à ce qu''il retrouve plus de lignes.'
returned: '%prefix% {warning}%count% {letters}pile(s) ne tiennent plus dans le coffre {highlight}%number% {letters}et t''ont été rendues.'
rewards-delivered: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}%amount% {letters}objet(s) de tes coffres t''ont été rendus.'
cooldown: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Attends {highlight}%time% ⌚ {error}avant d''ouvrir un autre coffre.'
in-combat: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Tu ne peux pas ouvrir de coffre en combat.'
disabled-world: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Les coffres ne peuvent pas être ouverts dans ce monde.'
disabled-game-mode: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Les coffres ne peuvent pas être ouverts dans ce mode de jeu.'
rename-prompt: '{primary}Nom du coffre %number% {letters_black}(- pour réinitialiser)'
name-invalid: '{error}Lettres, chiffres, espaces et - _ '' . ! ? # ( ) uniquement.'
renamed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Le coffre {highlight}%number% {letters}s''appelle maintenant {highlight}%name%{letters}.'
rename-reset: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Le coffre {highlight}%number% {letters}a retrouvé son nom d''origine.'
icon-prompt: '{primary}Choisis une icône pour le coffre %number%'
icon-changed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Le coffre {highlight}%number% {letters}a une nouvelle icône.'
no-permission: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Tu n''as pas la permission de faire ça.'
buy-prompt: '{primary}Acheter le coffre %number% pour %price% ?'
bought: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}Le coffre {highlight}%number% {success}est à toi. {letters}Payé {highlight}%price%{letters}.'
buy-too-poor: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Il te faut {highlight}%price% {error}pour acheter ce coffre.'
buy-limit: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Tu ne peux plus acheter de coffres.'
buy-disabled: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Les coffres ne peuvent pas être achetés sur ce serveur.'
buy-failed: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}L''achat n''a pas abouti et tu n''as pas été débité. Réessaie.'
search-header: '%prefix% {letters}Trouvé {highlight}%amount% {letters}de {highlight}%query% {letters}dans tes coffres :'
search-line: ' {letters_black}▎ {letters}%name% {letters_black}» {info}%amount%'
search-none: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Aucun de tes coffres ne contient {highlight}%query%{error}.'
admin-usage:
  - '%prefix% {letters}Utilisation{letters_black}:'
  - ' {letters_black}▎ {highlight}/pvadmin list <player>'
  - ' {letters_black}▎ {highlight}/pvadmin view <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin edit <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin history <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin clear <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin reload'
clear-prompt: '{error}Vider le coffre %number% de %player% ?'
cleared: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Le coffre {highlight}%number% {letters}de {highlight}%player% {letters}a été vidé. {letters_black}Son contenu est dans son historique.'
restore-prompt: '{warning}Remettre le coffre %number% de %player% comme il était %when% ?'
restored: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Le coffre {highlight}%number% {letters}de {highlight}%player% {letters}est de nouveau comme il était {highlight}%when%{letters}.'
history-empty: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Le coffre {highlight}%number% {error}de {highlight}%player% {error}n''a pas encore d''historique.'
snapshot-missing: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Cette copie n''est plus dans l''historique.'
reloaded: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}Configuration, messages et menus rechargés.'
