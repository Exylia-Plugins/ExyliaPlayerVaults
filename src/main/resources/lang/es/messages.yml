prefix: '{primary}&lBAÚLES {letters_black}•<reset>'
title: '{primary}&lBAÚL {letters_black}» {highlight}%name%'
admin-title: '{primary}&lBAÚL {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
view-title: '{primary}&lVER {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
snapshot-title: '{primary}&lCOPIA {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
default-name: '#%number%'
in-use: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Ese baúl está abierto en otro sitio ahora mismo. Inténtalo en un momento.'
not-unlocked: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}No tienes el baúl {highlight}%number%{error}.'
unreadable: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}No se pudo leer ese baúl. No se ha perdido nada; inténtalo de nuevo.'
blocked-item: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Ese objeto no se puede guardar en un baúl.'
lock-lost: '%prefix% {warning}El baúl {highlight}%number% {warning}se guardó y cerró tras un corte de conexión. {letters}Ábrelo de nuevo para seguir.'
taken-over: '%prefix% {warning}El baúl {highlight}%number% {warning}se guardó y cerró porque un miembro del staff lo está revisando.'
taking-over: '%prefix% {letters}El baúl {highlight}%number% {letters}estaba abierto en otro servidor; se está guardando y cerrando.'
hidden-stacks: '%prefix% {warning}%count% {letters}stack(s) de este baúl quedan ocultos hasta que vuelva a tener más filas.'
returned: '%prefix% {warning}%count% {letters}stack(s) ya no caben en el baúl {highlight}%number% {letters}y se te devolvieron.'
rewards-delivered: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}%amount% {letters}objeto(s) de tus baúles se te devolvieron.'
cooldown: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Espera {highlight}%time% ⌚ {error}antes de abrir otro baúl.'
in-combat: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}No puedes abrir un baúl en combate.'
disabled-world: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Los baúles no se pueden abrir en este mundo.'
disabled-game-mode: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Los baúles no se pueden abrir en este modo de juego.'
rename-prompt: '{primary}Nombre del baúl %number% {letters_black}(- para restablecer)'
name-invalid: '{error}Solo letras, números, espacios y - _ '' . ! ? # ( ).'
renamed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}El baúl {highlight}%number% {letters}ahora se llama {highlight}%name%{letters}.'
rename-reset: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}El baúl {highlight}%number% {letters}recuperó su nombre original.'
icon-prompt: '{primary}Elige un icono para el baúl %number%'
icon-changed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}El baúl {highlight}%number% {letters}tiene un icono nuevo.'
no-permission: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}No tienes permiso para hacer eso.'
buy-prompt: '{primary}¿Comprar el baúl %number% por %price%?'
bought: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}El baúl {highlight}%number% {success}es tuyo. {letters}Pagaste {highlight}%price%{letters}.'
buy-too-poor: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Necesitas {highlight}%price% {error}para comprar ese baúl.'
buy-limit: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}No puedes comprar más baúles.'
buy-disabled: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}En este servidor no se pueden comprar baúles.'
buy-failed: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}La compra no se completó y no se te cobró nada. Inténtalo de nuevo.'
search-header: '%prefix% {letters}Hay {highlight}%amount% {letters}de {highlight}%query% {letters}en tus baúles:'
search-line: ' {letters_black}▎ {letters}%name% {letters_black}» {info}%amount%'
search-none: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Ninguno de tus baúles tiene {highlight}%query%{error}.'
admin-usage:
  - '%prefix% {letters}Uso{letters_black}:'
  - ' {letters_black}▎ {highlight}/pvadmin list <player>'
  - ' {letters_black}▎ {highlight}/pvadmin view <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin edit <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin history <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin clear <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin reload'
clear-prompt: '{error}¿Vaciar el baúl %number% de %player%?'
cleared: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}El baúl {highlight}%number% {letters}de {highlight}%player% {letters}se vació. {letters_black}Su contenido está en su historial.'
restore-prompt: '{warning}¿Dejar el baúl %number% de %player% como estaba %when%?'
restored: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}El baúl {highlight}%number% {letters}de {highlight}%player% {letters}vuelve a estar como estaba {highlight}%when%{letters}.'
history-empty: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}El baúl {highlight}%number% {error}de {highlight}%player% {error}aún no tiene historial.'
snapshot-missing: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Esa copia ya no está en el historial.'
reloaded: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}Configuración, mensajes y menús recargados.'
