# NO EDITAR — SE REGENERA EN CADA INICIO.
#
# Dónde y cuándo se puede abrir un baúl. Todo lo demás está en config.yml.

title: "{primary}&lAJUSTES {letters_black}» {highlight}Acceso"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: IRON_DOOR
    name: "<gradient:{primary}:{secondary_light}>Acceso</gradient>"
    lore:
      - "{letters_black}Ajuste de Acceso"
      - ""
      - "{primary}✎ Información"
      - " {letters}Dónde y cuándo se puede abrir"
      - " {letters}un baúl, y el cofre de Ender."

  restrictions-open-cooldown:
    slot: 11
    material: CLOCK
    name: "{letters}Acceso {letters_black}▸ <gradient:{primary}:{secondary_light}>Espera al abrir</gradient>"
    lore:
      - "{letters_black}Ajuste de Acceso"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cuánto espera un jugador entre"
      - " {letters}abrir dos baúles. 0 lo desactiva."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:clock} {letters}Espera{letters_black}: %access_restrictions_open_cooldown%"
      - "  {letters_black}· {info}{icon:book} {letters}Predeterminado{letters_black}: %access_restrictions_open_cooldown_default%"
      - ""
      - "%access_restrictions_open_cooldown_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.open-cooldown"

  restrictions-block-in-combat:
    slot: 12
    material: IRON_SWORD
    name: "{letters}Acceso {letters_black}▸ <gradient:{primary}:{secondary_light}>Bloquear en combate</gradient>"
    lore:
      - "{letters_black}Ajuste de Acceso"
      - ""
      - "{primary}✎ Información"
      - " {letters}No deja abrir un baúl mientras"
      - " {letters}el jugador está en combate."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:kills} {letters}Bloqueo{letters_black}: %access_restrictions_block_in_combat%"
      - "  {letters_black}· {info}{icon:book} {letters}Predeterminado{letters_black}: %access_restrictions_block_in_combat_default%"
      - ""
      - "%access_restrictions_block_in_combat_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.block-in-combat"

  restrictions-disabled-worlds:
    slot: 13
    material: GRASS_BLOCK
    name: "{letters}Acceso {letters_black}▸ <gradient:{primary}:{secondary_light}>Mundos desactivados</gradient>"
    lore:
      - "{letters_black}Ajuste de Acceso"
      - ""
      - "{primary}✎ Información"
      - " {letters}Mundos donde no se pueden"
      - " {letters}abrir baúles, por nombre."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:book} {letters}Mundos{letters_black}: %access_restrictions_disabled_worlds%"
      - "  {letters_black}· {info}{icon:book} {letters}Predeterminado{letters_black}: %access_restrictions_disabled_worlds_default%"
      - ""
      - "%access_restrictions_disabled_worlds_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.disabled-worlds"

  restrictions-disabled-game-modes:
    slot: 14
    material: COMPASS
    name: "{letters}Acceso {letters_black}▸ <gradient:{primary}:{secondary_light}>Modos desactivados</gradient>"
    lore:
      - "{letters_black}Ajuste de Acceso"
      - ""
      - "{primary}✎ Información"
      - " {letters}Modos de juego donde no se puede"
      - " {letters}abrir baúles, como SPECTATOR."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:book} {letters}Modos{letters_black}: %access_restrictions_disabled_game_modes%"
      - "  {letters_black}· {info}{icon:book} {letters}Predeterminado{letters_black}: %access_restrictions_disabled_game_modes_default%"
      - ""
      - "%access_restrictions_disabled_game_modes_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.disabled-game-modes"

  replace-ender-chests:
    slot: 15
    material: ENDER_CHEST
    name: "{letters}Acceso {letters_black}▸ <gradient:{primary}:{secondary_light}>Reemplazar cofres de Ender</gradient>"
    lore:
      - "{letters_black}Ajuste de Acceso"
      - ""
      - "{primary}✎ Información"
      - " {letters}Abre la lista de baúles en vez"
      - " {letters}del cofre de Ender del jugador."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:book} {letters}Reemplazo{letters_black}: %access_replace_ender_chests%"
      - "  {letters_black}· {info}{icon:book} {letters}Predeterminado{letters_black}: %access_replace_ender_chests_default%"
      - ""
      - "%access_replace_ender_chests_click%"
    actions:
      - "exyliaplayervaults:setting access replace-ender-chests"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Volver {letters_black}▸ <gradient:{error}:{error_light}>Ajustes</gradient>"
    lore:
      - "{error}{icon:click} Clic para volver"
    actions:
      - "exyliaplayervaults:settings_hub"
