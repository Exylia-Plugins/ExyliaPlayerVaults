# NO EDITAR — SE REGENERA EN CADA INICIO.
#
# Copias anteriores de un baúl, de la más reciente a la más antigua. /pvadmin history <player> <number>
#
# Valores: %owner_name% %vault_number% %history_size%
# Cada copia: %snapshot_id% %snapshot_date% %snapshot_when% %snapshot_cause%
#             %snapshot_actor% %snapshot_used%

title: "{primary}&lHISTORIAL {letters_black}» {highlight}%owner_name% #%vault_number% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay más copias"
    lore:
      - ""
      - " {letters_black}▎ {letters}Se guarda una copia cada vez que el baúl cambia."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{primary}&lCOPIA {highlight}%snapshot_when% &8[{info}%snapshot_used%&8]"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Lo que guardaba el baúl antes de ser"
      - " {letters_black}▎ {highlight}%snapshot_cause% {letters}por {highlight}%snapshot_actor%{letters}."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Fecha {letters_black}» {info}%snapshot_date%"
      - " {letters_black}▎ {letters}Stacks {letters_black}» {info}%snapshot_used%"
      - ""
      - "{warning}➥ Clic izquierdo {letters_black}» {letters}ver contenido"
      - "{error}➥ Shift + clic derecho {letters_black}» {letters}restaurar esta copia"
      - " {letters_black}Se te pedirá confirmación."
      - ""
    actions:
      - "left: exyliaplayervaults:snapshot_view %snapshot_id%"
      - "shift_right: exyliaplayervaults:snapshot_restore %snapshot_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← PÁGINA ANTERIOR"
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lPÁGINA SIGUIENTE →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: BARREL
    name: "{primary}&lBAÚL {highlight}#%vault_number%"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Dueño {letters_black}» {highlight}%owner_name%"
      - " {letters_black}▎ {letters}Restaurar una copia guarda el"
      - " {letters_black}▎ {letters}contenido actual como una copia nueva."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Copias {letters_black}» {info}%history_size%"
      - ""
