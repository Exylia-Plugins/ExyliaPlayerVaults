# NO EDITAR — SE REGENERA EN CADA INICIO.
#
# Los ajustes de baúles que un admin cambia. Todo lo demás está en config.yml.

title: "{primary}&lAJUSTES {letters_black}» {highlight}Baúles"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
