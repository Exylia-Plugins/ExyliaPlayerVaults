    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: BARREL
    name: "<gradient:{primary}:{secondary_light}>Baúles</gradient>"
    lore:
      - "{letters_black}Ajustes de baúles"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cuántos baúles tiene un jugador,"
      - " {letters}su tamaño y qué pueden guardar."

  vaults-default-amount:
    slot: 10
    material: BARREL
    name: "{letters}Baúles {letters_black}▸ <gradient:{primary}:{secondary_light}>Baúles base</gradient>"
    lore:
      - "{letters_black}Ajuste de Baúles"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cuántos baúles tiene un jugador"
      - " {letters}sin ningún permiso propio."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:hopper} {letters}Baúles{letters_black}: %vaults_vaults_default_amount%"
      - "  {letters_black}· {info}{icon:book} {letters}Predeterminado{letters_black}: %vaults_vaults_default_amount_default%"
      - ""
      - "%vaults_vaults_default_amount_click%"
