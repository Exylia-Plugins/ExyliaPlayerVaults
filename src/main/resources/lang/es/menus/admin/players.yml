# NO EDITAR — SE REGENERA EN CADA INICIO.
#
# Todos los conectados a este servidor; cada uno abre sus baúles. /pvadmin
#
# Cada jugador: %player_name% %player_id%

title: "{primary}&lBAÚLES DE JUGADORES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay más jugadores"
    lore:
      - "{letters_black}Aquí aparecen los jugadores conectados."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primera página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '0-35'

  item_template:
    material: "playerhead-%player_name%"
    name: "{letters}Jugador {letters_black}▸ <gradient:{info}:{info_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Jugador conectado"
      - ""
      - "{info}✎ Información"
      - " {letters}Mira, edita, vacía o restaura"
      - " {letters}cualquiera de sus baúles."
      - ""
      - "{info}{icon:click} Clic para abrir"
    actions:
      - "exyliaplayervaults:list %player_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Siguiente →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  info:
    slot: 49
    material: COMPASS
    name: "<gradient:{info}:{info_light}>Otros jugadores</gradient>"
    lore:
      - "{letters_black}Resumen"
      - ""
      - "{info}✎ Información"
      - " {letters}¿Desconectado o en otro servidor?"
      - " {letters}Abre los baúles de cualquiera con:"
      - " {highlight}/pvadmin list <player>"

  settings:
    slot: 45
    material: COMPARATOR
    name: "{letters}Baúles {letters_black}▸ <gradient:{primary}:{secondary_light}>Ajustes</gradient>"
    lore:
      - "{letters_black}Ajustes del plugin"
      - ""
      - "{primary}✎ Información"
      - " {letters}Cambia los ajustes del plugin"
      - " {letters}sin editar sus {highlight}archivos{letters}."
      - ""
      - "{primary}{icon:click} Clic {letters_black}· {letters}Abrir ajustes"
    actions:
      - "exyliaplayervaults:settings"
