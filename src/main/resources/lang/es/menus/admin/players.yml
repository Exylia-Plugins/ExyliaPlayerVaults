    slot: 49
    material: COMPASS
    name: "{primary}&lOTROS JUGADORES"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}¿Desconectado o en otro servidor?"
      - " {letters_black}▎ {letters}Abre los baúles de cualquiera con:"
      - " {letters_black}▎ {highlight}/pvadmin list <player>"
      - ""
