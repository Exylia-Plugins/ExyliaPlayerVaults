# Tus baúles y los que un rango o una compra añadirían. /pv
#
# Puedes cambiar su estilo: tus cambios se conservan entre actualizaciones.
# Si una versión necesita cambiar el diseño, sube menu-version abajo; el
# archivo se reemplaza y el anterior se guarda a su lado.
#
# El staff abre esta misma pantalla sobre los baúles de alguien con /pvadmin list.
#
# Valores: %owner_name% %owner_id% %vaults_unlocked% %vaults_max% %vaults_bought% %vaults_rows%
# Cada baúl: %vault_number% %vault_name% %vault_icon% %vault_used% %vault_size%
#            %vault_free% %vault_owner% y, en el que está a la venta, %vault_price%

menu-version: 3

title: "{primary}&lBAÚLES {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay más baúles"
    lore:
      - "{letters_black}Un rango superior desbloquea más."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primera página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '10-16,19-25,28-34,37-43'

  item_template:
    material: "%vault_icon%"
    name: "{letters}Baúl {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient> &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - "{letters_black}Tu baúl"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}Usado{letters_black}: {info}%vault_used%{letters_black}/{info}%vault_size%"
      - "  {letters_black}· {success}{icon:check} {letters}Libre{letters_black}: {success}%vault_free%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}abrir"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}renombrar"
      - "{primary}{icon:right_click} Shift + clic derecho {letters_black}· {letters}cambiar icono"
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:icon %vault_owner% %vault_number%"

  # El staff viendo los baúles de otro: cada baúl guardado, con las herramientas de staff.
  admin_template:
    material: "%vault_icon%"
    name: "{letters}Baúl {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient> &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - "{letters_black}Baúl del jugador"
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:iron} {letters}Usado{letters_black}: {info}%vault_used%{letters_black}/{info}%vault_size%"
      - "  {letters_black}· {success}{icon:check} {letters}Libre{letters_black}: {success}%vault_free%"
      - ""
      - "{primary}{icon:click} Clic izquierdo {letters_black}· {letters}abrir"
      - "{primary}{icon:right_click} Clic derecho {letters_black}· {letters}renombrar"
      - "{primary}{icon:click} Soltar (Q) {letters_black}· {letters}cambiar icono"
      - "{primary}{icon:click} Shift + clic izquierdo {letters_black}· {letters}historial"
      - "{error}{icon:right_click} Shift + clic derecho {letters_black}· {letters}vaciar"
      - "{letters_black}Se te pedirá confirmación."
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "drop: exyliaplayervaults:icon %vault_owner% %vault_number%"
      - "shift_left: exyliaplayervaults:history %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:clear %vault_owner% %vault_number%"

  buy_template:
    material: GOLD_INGOT
    name: "{letters}Baúl {letters_black}▸ <gradient:{success}:{success_light}>Comprar #%vault_number%</gradient>"
    lore:
      - "{letters_black}Nuevo baúl"
      - ""
      - "{success}✎ Información"
      - " {letters}Un baúl más, tuyo para siempre."
      - ""
      - "{success}✦ Estado"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Precio{letters_black}: {highlight}%vault_price%"
      - ""
      - "{success}{icon:click} Clic para comprar"
    actions:
      - "left: exyliaplayervaults:buy"

  locked_template:
    material: GRAY_DYE
    name: "{letters}Baúl {letters_black}▸ <gradient:{warning}:{warning_light}>#%vault_number%</gradient>"
    lore:
      - "{letters_black}Baúl bloqueado"
      - ""
      - "{warning}✎ Información"
      - " {letters}Bloqueado."
      - " {letters}Un rango superior lo desbloquea."

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Siguiente →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  search:
    slot: 46
    material: SPYGLASS
    name: "{letters}Baúles {letters_black}▸ <gradient:{info}:{info_light}>Buscar</gradient>"
    lore:
      - "{letters_black}Búsqueda de baúles"
      - ""
      - "{info}✎ Información"
      - " {letters}Encuentra qué baúl guarda"
      - " {letters}un objeto, por nombre o"
      - " {letters}material, con cajas de"
      - " {letters}shulker y bolsas incluidas."
      - ""
      - "{info}{icon:click} Clic para buscar"
    actions:
      - "exyliaplayervaults:search %owner_id%"

  header:
    slot: 49
    material: "playerhead-%owner_name%"
    name: "<gradient:{info}:{info_light}>%owner_name%</gradient>"
    lore:
      - "{letters_black}Tus baúles"
      - ""
      - "{info}✎ Información"
      - " {letters}Un baúl se abre en un solo"
      - " {letters}sitio a la vez y se guarda"
      - " {letters}en cuanto lo cierras."
      - ""
      - "{info}✦ Estado"
      - "  {letters_black}· {info}{icon:key} {letters}Desbloqueados{letters_black}: {info}%vaults_unlocked%{letters_black}/{info}%vaults_max%"
      - "  {letters_black}· {info}{icon:gold} {letters}Comprados{letters_black}: {info}%vaults_bought%"
      - "  {letters_black}· {info}{icon:iron} {letters}Filas{letters_black}: {info}%vaults_rows%"
