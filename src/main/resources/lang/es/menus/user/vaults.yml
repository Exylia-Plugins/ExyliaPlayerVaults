# Tus baúles y los que un rango o una compra añadirían. /pv
#
# Puedes cambiar su estilo: tus cambios se conservan entre actualizaciones.
# Si una versión necesita cambiar el diseño, sube menu-version abajo; el
# archivo se reemplaza y el anterior se guarda a su lado.
#
# El staff abre esta misma pantalla sobre los baúles de alguien con /pvadmin list.
#
# Valores: %owner_name% %owner_id% %vaults_unlocked% %vaults_max% %vaults_bought% %vaults_rows%
# Cada baúl: %vault_number% %vault_name% %vault_icon% %vault_used% %vault_size%
#            %vault_free% %vault_owner% y, en el que está a la venta, %vault_price%

menu-version: 1

title: "{primary}&lBAÚLES {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No hay más baúles"
    lore:
      - ""
      - " {letters_black}▎ {letters}Un rango superior desbloquea más."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%vault_icon%"
    name: "{primary}&lBAÚL {highlight}%vault_name% &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Usado {letters_black}» {info}%vault_used%{letters_black}/{info}%vault_size%"
      - " {letters_black}▎ {letters}Libre {letters_black}» {success}%vault_free%"
      - ""
      - "{warning}➥ Clic izquierdo {letters_black}» {letters}abrir"
      - "{warning}➥ Clic derecho {letters_black}» {letters}renombrar"
      - "{warning}➥ Shift + clic derecho {letters_black}» {letters}cambiar icono"
      - ""
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:icon %vault_owner% %vault_number%"

  # El staff viendo los baúles de otro: cada baúl guardado, con las herramientas de staff.
  admin_template:
    material: "%vault_icon%"
    name: "{primary}&lBAÚL {highlight}%vault_name% &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Usado {letters_black}» {info}%vault_used%{letters_black}/{info}%vault_size%"
      - " {letters_black}▎ {letters}Libre {letters_black}» {success}%vault_free%"
      - ""
      - "{warning}➥ Clic izquierdo {letters_black}» {letters}abrir"
      - "{warning}➥ Clic derecho {letters_black}» {letters}renombrar"
      - "{warning}➥ Soltar (Q) {letters_black}» {letters}cambiar icono"
      - "{warning}➥ Shift + clic izquierdo {letters_black}» {letters}historial"
      - "{error}➥ Shift + clic derecho {letters_black}» {letters}vaciar"
      - " {letters_black}Se te pedirá confirmación."
      - ""
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "drop: exyliaplayervaults:icon %vault_owner% %vault_number%"
      - "shift_left: exyliaplayervaults:history %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:clear %vault_owner% %vault_number%"

  buy_template:
    material: GOLD_INGOT
    name: "{success}&lCOMPRAR BAÚL {highlight}#%vault_number%"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Un baúl más, tuyo para siempre."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Precio {letters_black}» {highlight}%vault_price%"
      - ""
      - "{warning}➥ Clic para comprar"
      - ""
    actions:
      - "left: exyliaplayervaults:buy"

  locked_template:
    material: GRAY_DYE
    name: "{muted}&lBAÚL #%vault_number%"
    lore:
      - ""
      - " {letters_black}▎ {letters_black}Bloqueado."
      - " {letters_black}▎ {letters_black}Un rango superior lo desbloquea."
      - ""

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← PÁGINA ANTERIOR"
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lPÁGINA SIGUIENTE →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  search:
    slot: 45
    material: SPYGLASS
    name: "{primary}&lBUSCAR"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Encuentra qué baúl guarda un objeto,"
      - " {letters_black}▎ {letters}por nombre o material, con cajas"
      - " {letters_black}▎ {letters}de shulker y bolsas incluidas."
      - ""
      - "{warning}➥ Clic para buscar"
      - ""
    actions:
      - "exyliaplayervaults:search %owner_id%"

  header:
    slot: 49
    material: "playerhead-%owner_name%"
    name: "{primary}&l%owner_name%"
    lore:
      - ""
      - "{secondary}Información:"
      - " {letters_black}▎ {letters}Un baúl se abre en un solo sitio a la vez"
      - " {letters_black}▎ {letters}y se guarda en cuanto lo cierras."
      - ""
      - "{secondary}Estado:"
      - " {letters_black}▎ {letters}Desbloqueados {letters_black}» {info}%vaults_unlocked%{letters_black}/{info}%vaults_max%"
      - " {letters_black}▎ {letters}Comprados {letters_black}» {info}%vaults_bought%"
      - " {letters_black}▎ {letters}Filas {letters_black}» {info}%vaults_rows%"
      - ""
