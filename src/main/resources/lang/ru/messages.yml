prefix: '{primary}&lХРАНИЛИЩА {letters_black}•<reset>'
title: '{primary}&lХРАНИЛИЩЕ {letters_black}» {highlight}%name%'
admin-title: '{primary}&lХРАНИЛИЩЕ {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
view-title: '{primary}&lПРОСМОТР {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
snapshot-title: '{primary}&lКОПИЯ {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
default-name: '#%number%'
in-use: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Это хранилище сейчас открыто в другом месте. Попробуй чуть позже.'
not-unlocked: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}У тебя нет хранилища {highlight}%number%{error}.'
unreadable: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Не удалось прочитать это хранилище. Ничего не потеряно; попробуй ещё раз.'
blocked-item: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Этот предмет нельзя положить в хранилище.'
lock-lost: '%prefix% {warning}Хранилище {highlight}%number% {warning}сохранено и закрыто после сбоя связи. {letters}Открой его снова, чтобы продолжить.'
taken-over: '%prefix% {warning}Хранилище {highlight}%number% {warning}сохранено и закрыто: его просматривает администрация.'
taking-over: '%prefix% {letters}Хранилище {highlight}%number% {letters}было открыто на другом сервере; оно сохраняется и закрывается.'
hidden-stacks: '%prefix% {warning}%count% {letters}стак(ов) этого хранилища скрыты, пока в нём снова не станет больше рядов.'
returned: '%prefix% {warning}%count% {letters}стак(ов) больше не помещаются в хранилище {highlight}%number% {letters}и возвращены тебе.'
rewards-delivered: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}%amount% {letters}предмет(ов) из твоих хранилищ возвращены тебе.'
cooldown: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Подожди {highlight}%time% ⌚ {error}перед тем, как открыть другое хранилище.'
in-combat: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Нельзя открыть хранилище в бою.'
disabled-world: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}В этом мире хранилища открывать нельзя.'
disabled-game-mode: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}В этом режиме игры хранилища открывать нельзя.'
rename-prompt: '{primary}Название хранилища %number% {letters_black}(- чтобы сбросить)'
name-invalid: '{error}Только буквы, цифры, пробелы и - _ '' . ! ? # ( ).'
renamed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Хранилище {highlight}%number% {letters}теперь называется {highlight}%name%{letters}.'
rename-reset: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Хранилищу {highlight}%number% {letters}вернули исходное название.'
icon-prompt: '{primary}Выбери значок для хранилища %number%'
icon-changed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}У хранилища {highlight}%number% {letters}новый значок.'
no-permission: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}У тебя нет прав на это.'
buy-prompt: '{primary}Купить хранилище %number% за %price%?'
bought: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}Хранилище {highlight}%number% {success}теперь твоё. {letters}Оплачено {highlight}%price%{letters}.'
buy-too-poor: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Нужно {highlight}%price%{error}, чтобы купить это хранилище.'
buy-limit: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Ты больше не можешь покупать хранилища.'
buy-disabled: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}На этом сервере хранилища не продаются.'
buy-failed: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Покупка не прошла, деньги не списаны. Попробуй ещё раз.'
search-header: '%prefix% {letters}Найдено {highlight}%query%{letters}: {highlight}%amount% {letters}в твоих хранилищах:'
search-line: ' {letters_black}▎ {letters}%name% {letters_black}» {info}%amount%'
search-none: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Ни в одном из твоих хранилищ нет {highlight}%query%{error}.'
admin-usage:
  - '%prefix% {letters}Использование{letters_black}:'
  - ' {letters_black}▎ {highlight}/pvadmin list <player>'
  - ' {letters_black}▎ {highlight}/pvadmin view <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin edit <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin history <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin clear <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin reload'
clear-prompt: '{error}Очистить хранилище %number% игрока %player%?'
cleared: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Хранилище {highlight}%number% {letters}игрока {highlight}%player% {letters}очищено. {letters_black}Его содержимое сохранено в истории.'
restore-prompt: '{warning}Вернуть хранилище %number% игрока %player% к состоянию %when%?'
restored: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}Хранилище {highlight}%number% {letters}игрока {highlight}%player% {letters}возвращено к состоянию {highlight}%when%{letters}.'
history-empty: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}У хранилища {highlight}%number% {error}игрока {highlight}%player% {error}пока нет истории.'
snapshot-missing: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Этой копии больше нет в истории.'
reloaded: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}Конфигурация, сообщения и меню перезагружены.'
