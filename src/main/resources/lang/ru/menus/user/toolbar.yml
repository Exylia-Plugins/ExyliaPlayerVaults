# Ряд кнопок под хранилищем, виден при включённом vaults.toolbar в config.yml.
#
# Можно менять оформление: правки сохраняются при обновлениях.
#
# Каждая кнопка занимает столбец ряда (слот 0-8); столбцы без кнопки
# показывают заполнитель. Кнопки - обычные предметы с действиями меню
# (left:, right:, shift_left:...). Клик сначала закрывает хранилище, кроме случая,
# когда все его действия лишь открывают другое хранилище: тогда окно меняется.
# "previous" и "next" показывают приглушённый предмет, если в этой стороне хранилища нет.
#
# Значения: %vault_owner% %vault_number% %vault_name% %previous_number%
#         %next_number% %vaults_unlocked%

menu-version: 1

filler:
  material: GRAY_STAINED_GLASS_PANE
  hide_tooltip: true

buttons:
  search:
    slot: 1
    material: SPYGLASS
    name: "{letters}Хранилища {letters_black}▸ <gradient:{info}:{info_light}>Поиск</gradient>"
    lore:
      - "{letters_black}Поиск по хранилищам"
      - ""
      - "{info}✎ Информация"
      - " {letters}Найдите, в каком хранилище"
      - " {letters}лежит предмет, включая шалкеры и мешки."
      - ""
      - "{info}{icon:click} Нажми, чтобы искать"
      - "{letters_black}Сначала закроет это хранилище."
    actions:
      - "exyliaplayervaults:search %vault_owner%"

  previous:
    slot: 3
    sound: "minecraft:item.book.page_turn|1.0|1.0"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
    name: "{letters}Хранилище {letters_black}▸ <gradient:{info}:{info_light}>← #%previous_number%</gradient>"
    lore:
      - "  {letters_black}· {letters}Хранилище{letters_black}: {info}%vault_number%{letters_black}/{info}%vaults_unlocked%"
      - ""
      - "{info}{icon:click} Нажми, чтобы открыть"
      - "{letters_black}Сохранит это хранилище и откроет другое."
    muted:
      material: GRAY_DYE
      name: "{muted}Нет предыдущего хранилища"
      lore:
        - "{letters_black}Это твоё первое хранилище."
    actions:
      - "exyliaplayervaults:open %vault_owner% %previous_number%"

  list:
    slot: 4
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Хранилища</gradient>"
    lore:
      - "{error}{icon:click} Нажми, чтобы вернуться"
      - "{letters_black}Все твои хранилища."
    actions:
      - "exyliaplayervaults:list %vault_owner%"

  next:
    slot: 5
    sound: "minecraft:item.book.page_turn|1.0|1.0"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
    name: "{letters}Хранилище {letters_black}▸ <gradient:{info}:{info_light}>#%next_number% →</gradient>"
    lore:
      - "  {letters_black}· {letters}Хранилище{letters_black}: {info}%vault_number%{letters_black}/{info}%vaults_unlocked%"
      - ""
      - "{info}{icon:click} Нажми, чтобы открыть"
      - "{letters_black}Сохранит это хранилище и откроет другое."
    muted:
      material: GRAY_DYE
      name: "{muted}Нет следующего хранилища"
      lore:
        - "{letters_black}Ранг выше откроет больше."
    actions:
      - "exyliaplayervaults:open %vault_owner% %next_number%"

  customize:
    slot: 7
    material: NAME_TAG
    name: "{letters}Vault {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient>"
    lore:
      - "{letters_black}Вид хранилища"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Название и значок этого"
      - " {letters}хранилища в твоём списке."
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}переименовать"
      - "{primary}{icon:right_click} ПКМ {letters_black}· {letters}сменить значок"
      - "{letters_black}Сначала закроет это хранилище."
    actions:
      - "left: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:icon %vault_owner% %vault_number%"
