# Твои хранилища и те, что добавит ранг или покупка. /pv
#
# Оформление можно менять: правки сохраняются между обновлениями.
# Если версии нужно изменить раскладку, она повышает menu-version ниже;
# тогда файл заменяется, а прежний сохраняется рядом.
#
# Администрация открывает этот же экран с чужими хранилищами через /pvadmin list.
#
# Значения: %owner_name% %owner_id% %vaults_unlocked% %vaults_max% %vaults_bought% %vaults_rows%
# Каждое хранилище: %vault_number% %vault_name% %vault_icon% %vault_used% %vault_size%
#                   %vault_free% %vault_owner% и, у продаваемого, %vault_price%

menu-version: 3

title: "{primary}&lХРАНИЛИЩА {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше хранилищ нет"
    lore:
      - "{letters_black}Ранг выше открывает больше."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Первая страница"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Последняя страница →"

pagination:
  slots: '10-16,19-25,28-34,37-43'

  item_template:
    material: "%vault_icon%"
    name: "{letters}Хранилище {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient> &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - "{letters_black}Твоё хранилище"
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:iron} {letters}Занято{letters_black}: {info}%vault_used%{letters_black}/{info}%vault_size%"
      - "  {letters_black}· {success}{icon:check} {letters}Свободно{letters_black}: {success}%vault_free%"
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}открыть"
      - "{primary}{icon:right_click} ПКМ {letters_black}· {letters}переименовать"
      - "{primary}{icon:right_click} Shift+ПКМ {letters_black}· {letters}сменить значок"
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:icon %vault_owner% %vault_number%"

  # Администрация смотрит чужие хранилища: каждое сохранённое хранилище, с инструментами администрации.
  admin_template:
    material: "%vault_icon%"
    name: "{letters}Хранилище {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient> &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - "{letters_black}Хранилище игрока"
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:iron} {letters}Занято{letters_black}: {info}%vault_used%{letters_black}/{info}%vault_size%"
      - "  {letters_black}· {success}{icon:check} {letters}Свободно{letters_black}: {success}%vault_free%"
      - ""
      - "{primary}{icon:click} ЛКМ {letters_black}· {letters}открыть"
      - "{primary}{icon:right_click} ПКМ {letters_black}· {letters}переименовать"
      - "{primary}{icon:click} Выбросить (Q) {letters_black}· {letters}сменить значок"
      - "{primary}{icon:click} Shift+ЛКМ {letters_black}· {letters}история"
      - "{error}{icon:right_click} Shift+ПКМ {letters_black}· {letters}очистить"
      - "{letters_black}Потребуется подтверждение."
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "drop: exyliaplayervaults:icon %vault_owner% %vault_number%"
      - "shift_left: exyliaplayervaults:history %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:clear %vault_owner% %vault_number%"

  buy_template:
    material: GOLD_INGOT
    name: "{letters}Хранилище {letters_black}▸ <gradient:{success}:{success_light}>Купить #%vault_number%</gradient>"
    lore:
      - "{letters_black}Новое хранилище"
      - ""
      - "{success}✎ Информация"
      - " {letters}Ещё одно хранилище, твоё навсегда."
      - ""
      - "{success}✦ Состояние"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Цена{letters_black}: {highlight}%vault_price%"
      - ""
      - "{success}{icon:click} Нажми, чтобы купить"
    actions:
      - "left: exyliaplayervaults:buy"

  locked_template:
    material: GRAY_DYE
    name: "{letters}Хранилище {letters_black}▸ <gradient:{warning}:{warning_light}>#%vault_number%</gradient>"
    lore:
      - "{letters_black}Закрытое хранилище"
      - ""
      - "{warning}✎ Информация"
      - " {letters}Закрыто."
      - " {letters}Ранг выше открывает его."

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Страница {letters_black}▸ <gradient:{error}:{error_light}>← Предыдущая</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Страница {letters_black}▸ <gradient:{success}:{success_light}>Следующая →</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  search:
    slot: 46
    material: SPYGLASS
    name: "{letters}Хранилища {letters_black}▸ <gradient:{info}:{info_light}>Поиск</gradient>"
    lore:
      - "{letters_black}Поиск по хранилищам"
      - ""
      - "{info}✎ Информация"
      - " {letters}Найди, в каком хранилище"
      - " {letters}лежит предмет, по"
      - " {letters}названию или материалу,"
      - " {letters}включая шалкеры и мешки."
      - ""
      - "{info}{icon:click} Нажми, чтобы искать"
    actions:
      - "exyliaplayervaults:search %owner_id%"

  header:
    slot: 49
    material: "playerhead-%owner_name%"
    name: "<gradient:{info}:{info_light}>%owner_name%</gradient>"
    lore:
      - "{letters_black}Твои хранилища"
      - ""
      - "{info}✎ Информация"
      - " {letters}Хранилище открыто только в"
      - " {letters}одном месте и сохраняется,"
      - " {letters}как только ты его закроешь."
      - ""
      - "{info}✦ Состояние"
      - "  {letters_black}· {info}{icon:key} {letters}Открыто{letters_black}: {info}%vaults_unlocked%{letters_black}/{info}%vaults_max%"
      - "  {letters_black}· {info}{icon:gold} {letters}Куплено{letters_black}: {info}%vaults_bought%"
      - "  {letters_black}· {info}{icon:iron} {letters}Рядов{letters_black}: {info}%vaults_rows%"
