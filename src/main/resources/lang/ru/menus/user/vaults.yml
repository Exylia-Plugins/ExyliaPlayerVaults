# Твои хранилища и те, что добавит ранг или покупка. /pv
#
# Оформление можно менять: правки сохраняются между обновлениями.
# Если версии нужно изменить раскладку, она повышает menu-version ниже;
# тогда файл заменяется, а прежний сохраняется рядом.
#
# Администрация открывает этот же экран с чужими хранилищами через /pvadmin list.
#
# Значения: %owner_name% %owner_id% %vaults_unlocked% %vaults_max% %vaults_bought% %vaults_rows%
# Каждое хранилище: %vault_number% %vault_name% %vault_icon% %vault_used% %vault_size%
#                   %vault_free% %vault_owner% и, у продаваемого, %vault_price%

menu-version: 1

title: "{primary}&lХРАНИЛИЩА {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше хранилищ нет"
    lore:
      - ""
      - " {letters_black}▎ {letters}Ранг выше открывает больше."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%vault_icon%"
    name: "{primary}&lХРАНИЛИЩЕ {highlight}%vault_name% &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - ""
      - "{secondary}Состояние:"
      - " {letters_black}▎ {letters}Занято {letters_black}» {info}%vault_used%{letters_black}/{info}%vault_size%"
      - " {letters_black}▎ {letters}Свободно {letters_black}» {success}%vault_free%"
      - ""
      - "{warning}➥ ЛКМ {letters_black}» {letters}открыть"
      - "{warning}➥ ПКМ {letters_black}» {letters}переименовать"
      - "{warning}➥ Shift+ПКМ {letters_black}» {letters}сменить значок"
      - ""
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:icon %vault_owner% %vault_number%"

  # Администрация смотрит чужие хранилища: каждое сохранённое хранилище, с инструментами администрации.
  admin_template:
    material: "%vault_icon%"
    name: "{primary}&lХРАНИЛИЩЕ {highlight}%vault_name% &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - ""
      - "{secondary}Состояние:"
      - " {letters_black}▎ {letters}Занято {letters_black}» {info}%vault_used%{letters_black}/{info}%vault_size%"
      - " {letters_black}▎ {letters}Свободно {letters_black}» {success}%vault_free%"
      - ""
      - "{warning}➥ ЛКМ {letters_black}» {letters}открыть"
      - "{warning}➥ ПКМ {letters_black}» {letters}переименовать"
      - "{warning}➥ Выбросить (Q) {letters_black}» {letters}сменить значок"
      - "{warning}➥ Shift+ЛКМ {letters_black}» {letters}история"
      - "{error}➥ Shift+ПКМ {letters_black}» {letters}очистить"
      - " {letters_black}Потребуется подтверждение."
      - ""
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "drop: exyliaplayervaults:icon %vault_owner% %vault_number%"
      - "shift_left: exyliaplayervaults:history %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:clear %vault_owner% %vault_number%"

  buy_template:
    material: GOLD_INGOT
    name: "{success}&lКУПИТЬ ХРАНИЛИЩЕ {highlight}#%vault_number%"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Ещё одно хранилище, твоё навсегда."
      - ""
      - "{secondary}Состояние:"
      - " {letters_black}▎ {letters}Цена {letters_black}» {highlight}%vault_price%"
      - ""
      - "{warning}➥ Нажми, чтобы купить"
      - ""
    actions:
      - "left: exyliaplayervaults:buy"

  locked_template:
    material: GRAY_DYE
    name: "{muted}&lХРАНИЛИЩЕ #%vault_number%"
    lore:
      - ""
      - " {letters_black}▎ {letters_black}Закрыто."
      - " {letters_black}▎ {letters_black}Ранг выше открывает его."
      - ""

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← ПРЕДЫДУЩАЯ СТРАНИЦА"
      lore:
        - ""
        - " {letters_black}▎ {letters}Страница {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lСЛЕДУЮЩАЯ СТРАНИЦА →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Страница {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  search:
    slot: 45
    material: SPYGLASS
    name: "{primary}&lПОИСК"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Найди, в каком хранилище лежит"
      - " {letters_black}▎ {letters}предмет, по названию или материалу,"
      - " {letters_black}▎ {letters}включая шалкеры и мешки."
      - ""
      - "{warning}➥ Нажми, чтобы искать"
      - ""
    actions:
      - "exyliaplayervaults:search %owner_id%"

  header:
    slot: 49
    material: "playerhead-%owner_name%"
    name: "{primary}&l%owner_name%"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Хранилище открыто только в одном месте"
      - " {letters_black}▎ {letters}и сохраняется, как только ты его закроешь."
      - ""
      - "{secondary}Состояние:"
      - " {letters_black}▎ {letters}Открыто {letters_black}» {info}%vaults_unlocked%{letters_black}/{info}%vaults_max%"
      - " {letters_black}▎ {letters}Куплено {letters_black}» {info}%vaults_bought%"
      - " {letters_black}▎ {letters}Рядов {letters_black}» {info}%vaults_rows%"
      - ""
