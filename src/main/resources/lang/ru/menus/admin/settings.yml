# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Настройки, которые стоит менять в игре, по темам. Остальное остаётся в файлах.

title: "{primary}&lХРАНИЛИЩА {letters_black}» {highlight}Настройки"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: COMPARATOR
    name: "<gradient:{primary}:{secondary_light}>Настройки</gradient>"
    lore:
      - "{letters_black}Настройки хранилищ"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Настройки, которые стоит менять"
      - " {letters}в игре, по темам. Остальное"
      - " {letters}остаётся в файлах."

  vaults:
    slot: 12
    material: BARREL
    name: "{letters}Настройки {letters_black}▸ <gradient:{primary}:{secondary_light}>Хранилища</gradient>"
    lore:
      - "{letters_black}Страница настроек"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Количество, ряды, запрещённые"
      - " {letters}предметы и история."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:hopper} {letters}Хранилища{letters_black}: %vaults_vaults_default_amount%"
      - "  {letters_black}· {info}{icon:book} {letters}Ряды{letters_black}: %vaults_vaults_default_rows%"
      - ""
      - "{primary}{icon:click} Нажмите, чтобы открыть"
      - "{letters_black}Каждая настройка с описанием."
    actions:
      - "exyliaplayervaults:settings_page vaults"

  access:
    slot: 13
    material: IRON_DOOR
    name: "{letters}Настройки {letters_black}▸ <gradient:{primary}:{secondary_light}>Доступ</gradient>"
    lore:
      - "{letters_black}Страница настроек"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Задержка, бой, миры и"
      - " {letters}режимы игры."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:clock} {letters}Задержка{letters_black}: %access_restrictions_open_cooldown%"
      - "  {letters_black}· {info}{icon:kills} {letters}Блок в бою{letters_black}: %access_restrictions_block_in_combat%"
      - ""
      - "{primary}{icon:click} Нажмите, чтобы открыть"
      - "{letters_black}Каждая настройка с описанием."
    actions:
      - "exyliaplayervaults:settings_page access"

  purchase:
    slot: 14
    material: GOLD_INGOT
    name: "{letters}Настройки {letters_black}▸ <gradient:{primary}:{secondary_light}>Покупка</gradient>"
    lore:
      - "{letters_black}Страница настроек"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Можно ли покупать хранилища"
      - " {letters}и цена первого."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:star} {letters}Покупка{letters_black}: %purchase_purchase_enabled%"
      - "  {letters_black}· {info}{icon:gold} {letters}Первая цена{letters_black}: %purchase_purchase_base_price%"
      - ""
      - "{primary}{icon:click} Нажмите, чтобы открыть"
      - "{letters_black}Каждая настройка с описанием."
    actions:
      - "exyliaplayervaults:settings_page purchase"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Хранилища игроков</gradient>"
    lore:
      - "{error}{icon:click} Нажмите, чтобы вернуться"
    actions:
      - "exyliaplayervaults:admin_hub"
