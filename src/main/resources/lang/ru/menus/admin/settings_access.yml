# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Где и когда можно открыть хранилище. Остальное в config.yml.

title: "{primary}&lНАСТРОЙКИ {letters_black}» {highlight}Доступ"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: IRON_DOOR
    name: "<gradient:{primary}:{secondary_light}>Доступ</gradient>"
    lore:
      - "{letters_black}Настройка: Доступ"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Где и когда можно открыть"
      - " {letters}хранилище, и эндер-сундук."

  restrictions-open-cooldown:
    slot: 11
    material: CLOCK
    name: "{letters}Доступ {letters_black}▸ <gradient:{primary}:{secondary_light}>Задержка открытия</gradient>"
    lore:
      - "{letters_black}Настройка: Доступ"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Пауза между открытием двух"
      - " {letters}хранилищ. 0 — отключено."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:clock} {letters}Задержка{letters_black}: %access_restrictions_open_cooldown%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %access_restrictions_open_cooldown_default%"
      - ""
      - "%access_restrictions_open_cooldown_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.open-cooldown"

  restrictions-block-in-combat:
    slot: 12
    material: IRON_SWORD
    name: "{letters}Доступ {letters_black}▸ <gradient:{primary}:{secondary_light}>Блок в бою</gradient>"
    lore:
      - "{letters_black}Настройка: Доступ"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Не даёт открыть хранилище,"
      - " {letters}пока игрок в бою."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:kills} {letters}Блок{letters_black}: %access_restrictions_block_in_combat%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %access_restrictions_block_in_combat_default%"
      - ""
      - "%access_restrictions_block_in_combat_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.block-in-combat"

  restrictions-disabled-worlds:
    slot: 13
    material: GRASS_BLOCK
    name: "{letters}Доступ {letters_black}▸ <gradient:{primary}:{secondary_light}>Отключённые миры</gradient>"
    lore:
      - "{letters_black}Настройка: Доступ"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Миры, где хранилища нельзя"
      - " {letters}открыть, по названию."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:book} {letters}Миры{letters_black}: %access_restrictions_disabled_worlds%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %access_restrictions_disabled_worlds_default%"
      - ""
      - "%access_restrictions_disabled_worlds_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.disabled-worlds"

  restrictions-disabled-game-modes:
    slot: 14
    material: COMPASS
    name: "{letters}Доступ {letters_black}▸ <gradient:{primary}:{secondary_light}>Отключённые режимы</gradient>"
    lore:
      - "{letters_black}Настройка: Доступ"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Режимы игры без хранилищ,"
      - " {letters}например SPECTATOR."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:book} {letters}Режимы{letters_black}: %access_restrictions_disabled_game_modes%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %access_restrictions_disabled_game_modes_default%"
      - ""
      - "%access_restrictions_disabled_game_modes_click%"
    actions:
      - "exyliaplayervaults:setting access restrictions.disabled-game-modes"

  replace-ender-chests:
    slot: 15
    material: ENDER_CHEST
    name: "{letters}Доступ {letters_black}▸ <gradient:{primary}:{secondary_light}>Заменять эндер-сундуки</gradient>"
    lore:
      - "{letters_black}Настройка: Доступ"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Открывает список хранилищ вместо"
      - " {letters}эндер-сундука игрока."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:book} {letters}Замена{letters_black}: %access_replace_ender_chests%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %access_replace_ender_chests_default%"
      - ""
      - "%access_replace_ender_chests_click%"
    actions:
      - "exyliaplayervaults:setting access replace-ender-chests"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Настройки</gradient>"
    lore:
      - "{error}{icon:click} Нажмите, чтобы вернуться"
    actions:
      - "exyliaplayervaults:settings_hub"
