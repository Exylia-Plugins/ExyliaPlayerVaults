# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Дополнительные хранилища за деньги. Остальное в config.yml.

title: "{primary}&lНАСТРОЙКИ {letters_black}» {highlight}Покупка"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: GOLD_INGOT
    name: "<gradient:{primary}:{secondary_light}>Покупка</gradient>"
    lore:
      - "{letters_black}Настройка: Покупка"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Дополнительные хранилища,"
      - " {letters}которые игроки покупают."

  purchase-enabled:
    slot: 11
    material: EMERALD
    name: "{letters}Покупка {letters_black}▸ <gradient:{primary}:{secondary_light}>Покупка хранилищ</gradient>"
    lore:
      - "{letters_black}Настройка: Покупка"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Позволяет покупать хранилища"
      - " {letters}сверх выданных рангом."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:star} {letters}Покупка{letters_black}: %purchase_purchase_enabled%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %purchase_purchase_enabled_default%"
      - ""
      - "%purchase_purchase_enabled_click%"
    actions:
      - "exyliaplayervaults:setting purchase purchase.enabled"

  purchase-currency:
    slot: 12
    material: SUNFLOWER
    name: "{letters}Покупка {letters_black}▸ <gradient:{primary}:{secondary_light}>Валюта</gradient>"
    lore:
      - "{letters_black}Настройка: Покупка"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Чем платят за хранилища."
      - " {letters}Пусто — валюта по умолчанию."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:gold} {letters}Валюта{letters_black}: %purchase_purchase_currency%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %purchase_purchase_currency_default%"
      - ""
      - "%purchase_purchase_currency_click%"
    actions:
      - "exyliaplayervaults:setting purchase purchase.currency"

  purchase-base-price:
    slot: 13
    material: GOLD_INGOT
    name: "{letters}Покупка {letters_black}▸ <gradient:{primary}:{secondary_light}>Базовая цена</gradient>"
    lore:
      - "{letters_black}Настройка: Покупка"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Сколько стоит первое купленное"
      - " {letters}хранилище."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:gold} {letters}Цена{letters_black}: %purchase_purchase_base_price%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %purchase_purchase_base_price_default%"
      - ""
      - "%purchase_purchase_base_price_click%"
    actions:
      - "exyliaplayervaults:setting purchase purchase.base-price"

  purchase-price-multiplier:
    slot: 14
    material: GOLD_NUGGET
    name: "{letters}Покупка {letters_black}▸ <gradient:{primary}:{secondary_light}>Множитель</gradient>"
    lore:
      - "{letters_black}Настройка: Покупка"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Каждое следующее стоит во столько"
      - " {letters}раз больше. 1.0 — без роста."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:gold} {letters}Множитель{letters_black}: %purchase_purchase_price_multiplier%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %purchase_purchase_price_multiplier_default%"
      - ""
      - "%purchase_purchase_price_multiplier_click%"
    actions:
      - "exyliaplayervaults:setting purchase purchase.price-multiplier"

  purchase-max-purchases:
    slot: 15
    material: HOPPER
    name: "{letters}Покупка {letters_black}▸ <gradient:{primary}:{secondary_light}>Лимит покупок</gradient>"
    lore:
      - "{letters_black}Настройка: Покупка"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Сколько хранилищ может купить"
      - " {letters}один игрок."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:star} {letters}Лимит{letters_black}: %purchase_purchase_max_purchases%"
      - "  {letters_black}· {info}{icon:book} {letters}По умолчанию{letters_black}: %purchase_purchase_max_purchases_default%"
      - ""
      - "%purchase_purchase_max_purchases_click%"
    actions:
      - "exyliaplayervaults:setting purchase purchase.max-purchases"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Назад {letters_black}▸ <gradient:{error}:{error_light}>Настройки</gradient>"
    lore:
      - "{error}{icon:click} Нажмите, чтобы вернуться"
    actions:
      - "exyliaplayervaults:settings_hub"
