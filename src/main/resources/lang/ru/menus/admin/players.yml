# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Все игроки на этом сервере; каждый открывает свои хранилища. /pvadmin
#
# Каждый игрок: %player_name% %player_id%

title: "{primary}&lХРАНИЛИЩА ИГРОКОВ {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше игроков нет"
    lore:
      - ""
      - " {letters_black}▎ {letters}Здесь появляются игроки на сервере."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "playerhead-%player_name%"
    name: "{primary}&l%player_name%"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Смотри, изменяй, очищай или"
      - " {letters_black}▎ {letters}восстанавливай любое их хранилище."
      - ""
      - "{warning}➥ Нажми, чтобы открыть"
      - ""
    actions:
      - "exyliaplayervaults:list %player_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← ПРЕДЫДУЩАЯ СТРАНИЦА"
      lore:
        - ""
        - " {letters_black}▎ {letters}Страница {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lСЛЕДУЮЩАЯ СТРАНИЦА →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Страница {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  info:
    slot: 49
    material: COMPASS
    name: "{primary}&lДРУГИЕ ИГРОКИ"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Не в сети или на другом сервере?"
      - " {letters_black}▎ {letters}Открой чьи угодно хранилища так:"
      - " {letters_black}▎ {highlight}/pvadmin list <player>"
      - ""
