# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Все игроки на этом сервере; каждый открывает свои хранилища. /pvadmin
#
# Каждый игрок: %player_name% %player_id%

title: "{primary}&lХРАНИЛИЩА ИГРОКОВ {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше игроков нет"
    lore:
      - "{letters_black}Здесь появляются игроки на сервере."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Первая страница"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Последняя страница →"

pagination:
  slots: '0-35'

  item_template:
    material: "playerhead-%player_name%"
    name: "{letters}Игрок {letters_black}▸ <gradient:{info}:{info_light}>%player_name%</gradient>"
    lore:
      - "{letters_black}Игрок в сети"
      - ""
      - "{info}✎ Информация"
      - " {letters}Смотри, изменяй, очищай или"
      - " {letters}восстанавливай любое их хранилище."
      - ""
      - "{info}{icon:click} Нажми, чтобы открыть"
    actions:
      - "exyliaplayervaults:list %player_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Страница {letters_black}▸ <gradient:{error}:{error_light}>← Предыдущая</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Страница {letters_black}▸ <gradient:{success}:{success_light}>Следующая →</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  info:
    slot: 49
    material: COMPASS
    name: "<gradient:{info}:{info_light}>Другие игроки</gradient>"
    lore:
      - "{letters_black}Обзор"
      - ""
      - "{info}✎ Информация"
      - " {letters}Не в сети или на другом сервере?"
      - " {letters}Открой чьи угодно хранилища так:"
      - " {highlight}/pvadmin list <player>"

  settings:
    slot: 45
    material: COMPARATOR
    name: "{letters}Хранилища {letters_black}▸ <gradient:{primary}:{secondary_light}>Настройки</gradient>"
    lore:
      - "{letters_black}Настройки плагина"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Меняйте настройки плагина"
      - " {letters}без правки его {highlight}файлов{letters}."
      - ""
      - "{primary}{icon:click} Клик {letters_black}· {letters}Открыть настройки"
    actions:
      - "exyliaplayervaults:settings"
