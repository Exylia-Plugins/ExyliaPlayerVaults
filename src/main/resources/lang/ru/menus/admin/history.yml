# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Прежние копии одного хранилища, от новых к старым. /pvadmin history <player> <number>
#
# Значения: %owner_name% %vault_number% %history_size%
# Каждая копия: %snapshot_id% %snapshot_date% %snapshot_when% %snapshot_cause%
#               %snapshot_actor% %snapshot_used%

title: "{primary}&lИСТОРИЯ {letters_black}» {highlight}%owner_name% #%vault_number% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше копий нет"
    lore:
      - ""
      - " {letters_black}▎ {letters}Копия сохраняется при каждом изменении."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{primary}&lКОПИЯ {highlight}%snapshot_when% &8[{info}%snapshot_used%&8]"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Что лежало в хранилище до действия"
      - " {letters_black}▎ {highlight}%snapshot_cause% {letters}от {highlight}%snapshot_actor%{letters}."
      - ""
      - "{secondary}Состояние:"
      - " {letters_black}▎ {letters}Дата {letters_black}» {info}%snapshot_date%"
      - " {letters_black}▎ {letters}Стаков {letters_black}» {info}%snapshot_used%"
      - ""
      - "{warning}➥ ЛКМ {letters_black}» {letters}посмотреть"
      - "{error}➥ Shift+ПКМ {letters_black}» {letters}вернуть эту копию"
      - " {letters_black}Потребуется подтверждение."
      - ""
    actions:
      - "left: exyliaplayervaults:snapshot_view %snapshot_id%"
      - "shift_right: exyliaplayervaults:snapshot_restore %snapshot_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← ПРЕДЫДУЩАЯ СТРАНИЦА"
      lore:
        - ""
        - " {letters_black}▎ {letters}Страница {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lСЛЕДУЮЩАЯ СТРАНИЦА →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Страница {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: BARREL
    name: "{primary}&lХРАНИЛИЩЕ {highlight}#%vault_number%"
    lore:
      - ""
      - "{secondary}Информация:"
      - " {letters_black}▎ {letters}Владелец {letters_black}» {highlight}%owner_name%"
      - " {letters_black}▎ {letters}При возврате копии текущее"
      - " {letters_black}▎ {letters}содержимое сохраняется как новая копия."
      - ""
      - "{secondary}Состояние:"
      - " {letters_black}▎ {letters}Копий {letters_black}» {info}%history_size%"
      - ""
