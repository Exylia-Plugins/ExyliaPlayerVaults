# НЕ РЕДАКТИРОВАТЬ — ПЕРЕСОЗДАЁТСЯ ПРИ КАЖДОМ ЗАПУСКЕ.
#
# Прежние копии одного хранилища, от новых к старым. /pvadmin history <player> <number>
#
# Значения: %owner_name% %vault_number% %history_size%
# Каждая копия: %snapshot_id% %snapshot_date% %snapshot_when% %snapshot_cause%
#               %snapshot_actor% %snapshot_used%

title: "{primary}&lИСТОРИЯ {letters_black}» {highlight}%owner_name% #%vault_number% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Больше копий нет"
    lore:
      - "{letters_black}Копия сохраняется при каждом изменении."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{letters}Копия {letters_black}▸ <gradient:{primary}:{secondary_light}>%snapshot_when%</gradient> &8[{info}%snapshot_used%&8]"
    lore:
      - "{letters_black}Копия хранилища"
      - ""
      - "{primary}✎ Информация"
      - " {letters}Что лежало в хранилище до действия"
      - " {highlight}%snapshot_cause% {letters}от {highlight}%snapshot_actor%{letters}."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {info}{icon:clock} {letters}Дата{letters_black}: {info}%snapshot_date%"
      - "  {letters_black}· {info}{icon:iron} {letters}Стаков{letters_black}: {info}%snapshot_used%"
      - ""
      - "{primary}» ЛКМ {letters_black}· {letters}посмотреть"
      - "{error}» Shift+ПКМ {letters_black}· {letters}вернуть эту копию"
      - "{letters_black}Потребуется подтверждение."
    actions:
      - "left: exyliaplayervaults:snapshot_view %snapshot_id%"
      - "shift_right: exyliaplayervaults:snapshot_restore %snapshot_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Страница {letters_black}▸ <gradient:{error}:{error_light}>← Предыдущая</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Страница {letters_black}▸ <gradient:{success}:{success_light}>Следующая →</gradient>"
      lore:
        - "  {letters_black}· {letters}Страница{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: BARREL
    name: "<gradient:{primary}:{secondary_light}>Хранилище #%vault_number%</gradient>"
    lore:
      - "{letters_black}История хранилища"
      - ""
      - "{primary}✎ Информация"
      - " {letters}При возврате копии текущее"
      - " {letters}содержимое сохраняется как"
      - " {letters}новая копия."
      - ""
      - "{primary}✦ Состояние"
      - "  {letters_black}· {highlight}{icon:tag} {letters}Владелец{letters_black}: {highlight}%owner_name%"
      - "  {letters_black}· {info}{icon:book} {letters}Копий{letters_black}: {info}%history_size%"
