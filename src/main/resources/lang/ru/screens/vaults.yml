  name: '{success}Купить #%vault_number%'
  tooltip: '{success}Купить хранилище #%vault_number%<nl>{letters_black}Ещё одно хранилище, навсегда ваше.<nl>{letters_black}Цена {highlight}%vault_price%<nl>{success}Клик {letters_black}· {letters}купить'
locked:
  name: '{muted}Закрыто'
  tooltip: '{warning}Хранилище #%vault_number%<nl>{letters_black}Открывается более высоким рангом.'
empty:
  title: 'Хранилищ пока нет'
  hint: 'Более высокий ранг открывает больше'
foot: '{letters_black}Наведите на хранилище, чтобы увидеть действия кликов'
owner: '{letters_black}Владелец'
unlocked: '{letters}Открыто'
bought: '{letters}Куплено'
rows: '{letters}Рядов в каждом'
search:
  hint: '{letters_black}В каком хранилище предмет?'
  button: 'Поиск'
nav:
  vaults: 'Хранилища'
keys: '{highlight}Клик {letters_black}открыть   {highlight}Правый {letters_black}имя   {highlight}<key:key.sprint> {letters_black}значок'
keys_staff: '{highlight}Клик {letters_black}открыть   {highlight}Правый {letters_black}имя   {highlight}<key:key.sprint> {letters_black}история'
found:
  title: '{highlight}Поиск'
  subtitle: '{info}%search_hits% {letters_black}· {highlight}%search_query%'
  back: '‹ Хранилища'
  holds: '{letters_black}Хранит {info}%vault_amount%'
  go: '{info}Открыть »'
  empty: 'Ничего не найдено'
