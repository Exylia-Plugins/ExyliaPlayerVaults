# Тексты экрана хранилищ (screens/vaults.html), по одному на каждый t="ключ". Цвета вроде {info} здесь работают;
# сохраняйте %placeholders%. Строки подсказки разделяются <nl>.
title: '{highlight}Хранилища'
subtitle: '{letters_black}Сохраняется при закрытии · открыто только в одном месте'
own:
  tooltip: '%vault_name%<nl>{letters_black}Занято {info}%vault_used%{letters_black}/{info}%vault_size%{letters_black} · свободно {success}%vault_free%<nl>{primary}Клик {letters_black}· {letters}открыть<nl>{primary}ПКМ {letters_black}· {letters}переименовать<nl>{primary}<key:key.sprint> + клик {letters_black}· {letters}сменить иконку'
admin:
  tooltip: '%vault_name%<nl>{letters_black}Занято {info}%vault_used%{letters_black}/{info}%vault_size%{letters_black} · свободно {success}%vault_free%<nl>{primary}Клик {letters_black}· {letters}открыть<nl>{primary}ПКМ {letters_black}· {letters}переименовать<nl>{primary}<key:key.sprint> + клик {letters_black}· {letters}история'
  icon: 'Иконка'
  clear: 'Очистить'
