# Seus baús e os que um rank ou uma compra adicionariam. /pv
#
# Você pode mudar o estilo: suas edições são mantidas entre atualizações.
# Se uma versão precisar mudar o layout, ela aumenta menu-version abaixo; o
# arquivo é substituído e o anterior fica guardado ao lado.
#
# A staff abre esta mesma tela nos baús de alguém com /pvadmin list.
#
# Valores: %owner_name% %owner_id% %vaults_unlocked% %vaults_max% %vaults_bought% %vaults_rows%
# Cada baú: %vault_number% %vault_name% %vault_icon% %vault_used% %vault_size%
#           %vault_free% %vault_owner% e, no que está à venda, %vault_price%

menu-version: 3

title: "{primary}&lBAÚS {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais baús"
    lore:
      - "{letters_black}Um rank maior desbloqueia mais."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primeira página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '10-16,19-25,28-34,37-43'

  item_template:
    material: "%vault_icon%"
    name: "{letters}Baú {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient> &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - "{letters_black}Seu baú"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Usado{letters_black}: {info}%vault_used%{letters_black}/{info}%vault_size%"
      - "  {letters_black}· {success}{icon:check} {letters}Livre{letters_black}: {success}%vault_free%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}abrir"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}renomear"
      - "{primary}{icon:right_click} Shift + clique direito {letters_black}· {letters}mudar ícone"
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:icon %vault_owner% %vault_number%"

  # A staff vendo os baús de outra pessoa: cada baú guardado, com as ferramentas da staff.
  admin_template:
    material: "%vault_icon%"
    name: "{letters}Baú {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient> &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - "{letters_black}Baú do jogador"
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:iron} {letters}Usado{letters_black}: {info}%vault_used%{letters_black}/{info}%vault_size%"
      - "  {letters_black}· {success}{icon:check} {letters}Livre{letters_black}: {success}%vault_free%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}abrir"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}renomear"
      - "{primary}{icon:click} Soltar (Q) {letters_black}· {letters}mudar ícone"
      - "{primary}{icon:click} Shift + clique esquerdo {letters_black}· {letters}histórico"
      - "{error}{icon:right_click} Shift + clique direito {letters_black}· {letters}esvaziar"
      - "{letters_black}Será pedida uma confirmação."
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "drop: exyliaplayervaults:icon %vault_owner% %vault_number%"
      - "shift_left: exyliaplayervaults:history %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:clear %vault_owner% %vault_number%"

  buy_template:
    material: GOLD_INGOT
    name: "{letters}Baú {letters_black}▸ <gradient:{success}:{success_light}>Comprar #%vault_number%</gradient>"
    lore:
      - "{letters_black}Novo baú"
      - ""
      - "{success}✎ Informação"
      - " {letters}Mais um baú, seu para sempre."
      - ""
      - "{success}✦ Status"
      - "  {letters_black}· {highlight}{icon:gold} {letters}Preço{letters_black}: {highlight}%vault_price%"
      - ""
      - "{success}{icon:click} Clique para comprar"
    actions:
      - "left: exyliaplayervaults:buy"

  locked_template:
    material: GRAY_DYE
    name: "{letters}Baú {letters_black}▸ <gradient:{warning}:{warning_light}>#%vault_number%</gradient>"
    lore:
      - "{letters_black}Baú bloqueado"
      - ""
      - "{warning}✎ Informações"
      - " {letters}Bloqueado."
      - " {letters}Um rank maior o desbloqueia."

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  search:
    slot: 46
    material: SPYGLASS
    name: "{letters}Baús {letters_black}▸ <gradient:{info}:{info_light}>Procurar</gradient>"
    lore:
      - "{letters_black}Busca de baús"
      - ""
      - "{info}✎ Informação"
      - " {letters}Descubra qual baú guarda um item,"
      - " {letters}por nome ou material, com caixas"
      - " {letters}de shulker e sacolas incluídas."
      - ""
      - "{info}{icon:click} Clique para procurar"
    actions:
      - "exyliaplayervaults:search %owner_id%"

  header:
    slot: 49
    material: "playerhead-%owner_name%"
    name: "<gradient:{info}:{info_light}>%owner_name%</gradient>"
    lore:
      - "{letters_black}Seus baús"
      - ""
      - "{info}✎ Informação"
      - " {letters}Um baú fica aberto em um"
      - " {letters}só lugar por vez e é salvo"
      - " {letters}assim que você o fecha."
      - ""
      - "{info}✦ Status"
      - "  {letters_black}· {info}{icon:key} {letters}Desbloqueados{letters_black}: {info}%vaults_unlocked%{letters_black}/{info}%vaults_max%"
      - "  {letters_black}· {info}{icon:gold} {letters}Comprados{letters_black}: {info}%vaults_bought%"
      - "  {letters_black}· {info}{icon:iron} {letters}Linhas{letters_black}: {info}%vaults_rows%"
