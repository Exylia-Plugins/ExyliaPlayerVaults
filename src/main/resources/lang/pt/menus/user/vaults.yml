# Seus baús e os que um rank ou uma compra adicionariam. /pv
#
# Você pode mudar o estilo: suas edições são mantidas entre atualizações.
# Se uma versão precisar mudar o layout, ela aumenta menu-version abaixo; o
# arquivo é substituído e o anterior fica guardado ao lado.
#
# A staff abre esta mesma tela nos baús de alguém com /pvadmin list.
#
# Valores: %owner_name% %vaults_unlocked% %vaults_max% %vaults_bought% %vaults_rows%
# Cada baú: %vault_number% %vault_name% %vault_icon% %vault_used% %vault_size%
#           %vault_free% %vault_owner% e, no que está à venda, %vault_price%

menu-version: 1

title: "{primary}&lBAÚS {letters_black}» {highlight}%owner_name% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais baús"
    lore:
      - ""
      - " {letters_black}▎ {letters}Um rank maior desbloqueia mais."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "%vault_icon%"
    name: "{primary}&lBAÚ {highlight}%vault_name% &8[{success}%vault_used%&8/{warning}%vault_size%&8]"
    lore:
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Usado {letters_black}» {info}%vault_used%{letters_black}/{info}%vault_size%"
      - " {letters_black}▎ {letters}Livre {letters_black}» {success}%vault_free%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}abrir"
      - "{warning}➥ Clique direito {letters_black}» {letters}renomear"
      - "{warning}➥ Shift + clique direito {letters_black}» {letters}mudar ícone"
      - ""
    actions:
      - "left: exyliaplayervaults:open %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "shift_right: exyliaplayervaults:icon %vault_owner% %vault_number%"

  buy_template:
    material: GOLD_INGOT
    name: "{success}&lCOMPRAR BAÚ {highlight}#%vault_number%"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Mais um baú, seu para sempre."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Preço {letters_black}» {highlight}%vault_price%"
      - ""
      - "{warning}➥ Clique para comprar"
      - ""
    actions:
      - "left: exyliaplayervaults:buy"

  locked_template:
    material: GRAY_DYE
    name: "{muted}&lBAÚ #%vault_number%"
    lore:
      - ""
      - " {letters_black}▎ {letters_black}Bloqueado."
      - " {letters_black}▎ {letters_black}Um rank maior o desbloqueia."
      - ""

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← PÁGINA ANTERIOR"
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lPRÓXIMA PÁGINA →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: "playerhead-%owner_name%"
    name: "{primary}&l%owner_name%"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Um baú fica aberto em um só lugar por vez"
      - " {letters_black}▎ {letters}e é salvo assim que você o fecha."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Desbloqueados {letters_black}» {info}%vaults_unlocked%{letters_black}/{info}%vaults_max%"
      - " {letters_black}▎ {letters}Comprados {letters_black}» {info}%vaults_bought%"
      - " {letters_black}▎ {letters}Linhas {letters_black}» {info}%vaults_rows%"
      - ""
