# A fileira de botões sob um baú, exibida quando vaults.toolbar está ativo em config.yml.
#
# Você pode mudar o estilo: suas edições são mantidas entre atualizações.
#
# Cada botão ocupa uma coluna da fileira (espaço 0 a 8); colunas sem botão
# mostram o preenchimento. Os botões são itens comuns com ações de menu
# (left:, right:, shift_left:...). Um clique fecha o baú antes, a menos que
# todas as ações dele apenas abram outro baú, o que troca a janela.
# "previous" e "next" mostram o item apagado quando não há baú nessa direção.
#
# Valores: %vault_owner% %vault_number% %vault_name% %previous_number%
#         %next_number% %vaults_unlocked%

menu-version: 1

filler:
  material: GRAY_STAINED_GLASS_PANE
  hide_tooltip: true

buttons:
  search:
    slot: 1
    material: SPYGLASS
    name: "{letters}Baús {letters_black}▸ <gradient:{info}:{info_light}>Pesquisar</gradient>"
    lore:
      - "{letters_black}Pesquisa de baús"
      - ""
      - "{info}✎ Informação"
      - " {letters}Descubra qual baú guarda um"
      - " {letters}item, com shulkers e sacolas."
      - ""
      - "{info}{icon:click} Clique para pesquisar"
      - "{letters_black}Fecha este baú antes."
    actions:
      - "exyliaplayervaults:search %vault_owner%"

  previous:
    slot: 3
    sound: "minecraft:item.book.page_turn|1.0|1.0"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
    name: "{letters}Baú {letters_black}▸ <gradient:{info}:{info_light}>← #%previous_number%</gradient>"
    lore:
      - "  {letters_black}· {letters}Baú{letters_black}: {info}%vault_number%{letters_black}/{info}%vaults_unlocked%"
      - ""
      - "{info}{icon:click} Clique para abrir"
      - "{letters_black}Salva este baú e abre o outro."
    muted:
      material: GRAY_DYE
      name: "{muted}Sem baú anterior"
      lore:
        - "{letters_black}Este é o seu primeiro baú."
    actions:
      - "exyliaplayervaults:open %vault_owner% %previous_number%"

  list:
    slot: 4
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Voltar {letters_black}▸ <gradient:{error}:{error_light}>Baús</gradient>"
    lore:
      - "{error}{icon:click} Clique para voltar"
      - "{letters_black}Todos os seus baús."
    actions:
      - "exyliaplayervaults:list %vault_owner%"

  next:
    slot: 5
    sound: "minecraft:item.book.page_turn|1.0|1.0"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
    name: "{letters}Baú {letters_black}▸ <gradient:{info}:{info_light}>#%next_number% →</gradient>"
    lore:
      - "  {letters_black}· {letters}Baú{letters_black}: {info}%vault_number%{letters_black}/{info}%vaults_unlocked%"
      - ""
      - "{info}{icon:click} Clique para abrir"
      - "{letters_black}Salva este baú e abre o outro."
    muted:
      material: GRAY_DYE
      name: "{muted}Sem próximo baú"
      lore:
        - "{letters_black}Um rank maior libera mais."
    actions:
      - "exyliaplayervaults:open %vault_owner% %next_number%"

  customize:
    slot: 7
    material: NAME_TAG
    name: "{letters}Vault {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient>"
    lore:
      - "{letters_black}Aparência do baú"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O nome e o ícone deste baú"
      - " {letters}na sua lista."
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}renomear"
      - "{primary}{icon:right_click} Clique direito {letters_black}· {letters}mudar ícone"
      - "{letters_black}Fecha este baú antes."
    actions:
      - "left: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:icon %vault_owner% %vault_number%"
