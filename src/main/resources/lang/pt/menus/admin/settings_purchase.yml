    material: HOPPER
    name: "{letters}Compra {letters_black}▸ <gradient:{primary}:{secondary_light}>Limite de compras</gradient>"
    lore:
      - "{letters_black}Ajuste de Compra"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O máximo de baús que um jogador"
      - " {letters}pode comprar."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:star} {letters}Limite{letters_black}: %purchase_purchase_max_purchases%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %purchase_purchase_max_purchases_default%"
      - ""
      - "%purchase_purchase_max_purchases_click%"
    actions:
      - "exyliaplayervaults:setting purchase purchase.max-purchases"

