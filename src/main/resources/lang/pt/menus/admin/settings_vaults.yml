# NÃO EDITE — REGENERADO A CADA INÍCIO.
#
# Os ajustes de baús que um admin muda. O resto está em config.yml.

title: "{primary}&lAJUSTES {letters_black}» {highlight}Baús"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: BARREL
    name: "<gradient:{primary}:{secondary_light}>Baús</gradient>"
    lore:
      - "{letters_black}Ajustes dos baús"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Quantos baús um jogador tem,"
      - " {letters}o tamanho deles e o que guardam."

  vaults-default-amount:
    slot: 10
    material: BARREL
    name: "{letters}Baús {letters_black}▸ <gradient:{primary}:{secondary_light}>Baús base</gradient>"
    lore:
      - "{letters_black}Ajuste de Baús"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Quantos baús um jogador tem"
      - " {letters}sem permissão própria."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:hopper} {letters}Baús{letters_black}: %vaults_vaults_default_amount%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %vaults_vaults_default_amount_default%"
      - ""
      - "%vaults_vaults_default_amount_click%"
    actions:
      - "exyliaplayervaults:setting vaults vaults.default-amount"

  vaults-max-amount:
    slot: 11
    material: CHEST
    name: "{letters}Baús {letters_black}▸ <gradient:{primary}:{secondary_light}>Limite de baús</gradient>"
    lore:
      - "{letters_black}Ajuste de Baús"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O máximo de baús por jogador,"
      - " {letters}comprados incluídos."
      - ""
      - "{primary}✦ Estado"
