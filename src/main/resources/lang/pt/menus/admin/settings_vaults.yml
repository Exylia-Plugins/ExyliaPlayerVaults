  vaults-default-rows:
    slot: 12
    material: LADDER
    name: "{letters}Baús {letters_black}▸ <gradient:{primary}:{secondary_light}>Linhas base</gradient>"
    lore:
      - "{letters_black}Ajuste de Baús"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Quantas linhas (1 a 6) um baú"
