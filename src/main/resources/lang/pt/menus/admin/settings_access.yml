# NÃO EDITE — REGENERADO A CADA INÍCIO.
#
# Onde e quando um baú pode ser aberto. O resto está em config.yml.

title: "{primary}&lAJUSTES {letters_black}» {highlight}Acesso"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: IRON_DOOR
    name: "<gradient:{primary}:{secondary_light}>Acesso</gradient>"
    lore:
      - "{letters_black}Ajuste de Acesso"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Onde e quando um baú pode ser"
      - " {letters}aberto, e o ender chest."

  restrictions-open-cooldown:
    slot: 11
    material: CLOCK
    name: "{letters}Acesso {letters_black}▸ <gradient:{primary}:{secondary_light}>Espera ao abrir</gradient>"
    lore:
      - "{letters_black}Ajuste de Acesso"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Quanto um jogador espera entre"
      - " {letters}abrir dois baús. 0 desliga."
      - ""
      - "{primary}✦ Estado"
      - "  {letters_black}· {info}{icon:clock} {letters}Espera{letters_black}: %access_restrictions_open_cooldown%"
      - "  {letters_black}· {info}{icon:book} {letters}Padrão{letters_black}: %access_restrictions_open_cooldown_default%"
      - ""
      - "%access_restrictions_open_cooldown_click%"
