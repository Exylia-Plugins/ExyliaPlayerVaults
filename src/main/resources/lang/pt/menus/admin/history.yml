# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Cópias anteriores de um baú, da mais recente à mais antiga. /pvadmin history <player> <number>
#
# Valores: %owner_name% %vault_number% %history_size%
# Cada cópia: %snapshot_id% %snapshot_date% %snapshot_when% %snapshot_cause%
#             %snapshot_actor% %snapshot_used%

title: "{primary}&lHISTÓRICO {letters_black}» {highlight}%owner_name% #%vault_number% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais cópias"
    lore:
      - ""
      - " {letters_black}▎ {letters}Uma cópia é guardada sempre que o baú muda."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{primary}&lCÓPIA {highlight}%snapshot_when% &8[{info}%snapshot_used%&8]"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}O que o baú guardava antes de ser"
      - " {letters_black}▎ {highlight}%snapshot_cause% {letters}por {highlight}%snapshot_actor%{letters}."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Data {letters_black}» {info}%snapshot_date%"
      - " {letters_black}▎ {letters}Pilhas {letters_black}» {info}%snapshot_used%"
      - ""
      - "{warning}➥ Clique esquerdo {letters_black}» {letters}ver conteúdo"
      - "{error}➥ Shift + clique direito {letters_black}» {letters}restaurar esta cópia"
      - " {letters_black}Será pedida uma confirmação."
      - ""
    actions:
      - "left: exyliaplayervaults:snapshot_view %snapshot_id%"
      - "shift_right: exyliaplayervaults:snapshot_restore %snapshot_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← PÁGINA ANTERIOR"
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lPRÓXIMA PÁGINA →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: BARREL
    name: "{primary}&lBAÚ {highlight}#%vault_number%"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Dono {letters_black}» {highlight}%owner_name%"
      - " {letters_black}▎ {letters}Restaurar uma cópia guarda o"
      - " {letters_black}▎ {letters}conteúdo atual como uma nova cópia."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Cópias {letters_black}» {info}%history_size%"
      - ""
