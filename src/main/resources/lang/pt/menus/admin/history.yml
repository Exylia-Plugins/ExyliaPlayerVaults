# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Cópias anteriores de um baú, da mais recente à mais antiga. /pvadmin history <player> <number>
#
# Valores: %owner_name% %vault_number% %history_size%
# Cada cópia: %snapshot_id% %snapshot_date% %snapshot_when% %snapshot_cause%
#             %snapshot_actor% %snapshot_used%

title: "{primary}&lHISTÓRICO {letters_black}» {highlight}%owner_name% #%vault_number% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais cópias"
    lore:
      - "{letters_black}Uma cópia é guardada sempre que o baú muda."
    hide_tooltip: false
  custom:
    page_first:
      slots: '48'
      material: GRAY_DYE
      name: "{muted}← Primeira página"
    page_last:
      slots: '50'
      material: GRAY_DYE
      name: "{muted}Última página →"

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{letters}Cópia {letters_black}▸ <gradient:{primary}:{secondary_light}>%snapshot_when%</gradient> &8[{info}%snapshot_used%&8]"
    lore:
      - "{letters_black}Cópia do baú"
      - ""
      - "{primary}✎ Informação"
      - " {letters}O que o baú guardava antes de ser"
      - " {highlight}%snapshot_cause% {letters}por {highlight}%snapshot_actor%{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Data{letters_black}: {info}%snapshot_date%"
      - "  {letters_black}· {info}{icon:iron} {letters}Pilhas{letters_black}: {info}%snapshot_used%"
      - ""
      - "{primary}{icon:click} Clique esquerdo {letters_black}· {letters}ver conteúdo"
      - "{error}{icon:right_click} Shift + clique direito {letters_black}· {letters}restaurar esta cópia"
      - "{letters_black}Será pedida uma confirmação."
    actions:
      - "left: exyliaplayervaults:snapshot_view %snapshot_id%"
      - "shift_right: exyliaplayervaults:snapshot_restore %snapshot_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{error}:{error_light}>← Anterior</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Página {letters_black}▸ <gradient:{success}:{success_light}>Próxima →</gradient>"
      lore:
        - "  {letters_black}· {letters}Página{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: BARREL
    name: "<gradient:{primary}:{secondary_light}>Baú #%vault_number%</gradient>"
    lore:
      - "{letters_black}Histórico do baú"
      - ""
      - "{primary}✎ Informação"
      - " {letters}Restaurar uma cópia"
      - " {letters}guarda o conteúdo atual"
      - " {letters}como uma nova cópia."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {highlight}{icon:tag} {letters}Dono{letters_black}: {highlight}%owner_name%"
      - "  {letters_black}· {info}{icon:book} {letters}Cópias{letters_black}: {info}%history_size%"
