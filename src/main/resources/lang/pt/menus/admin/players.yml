# NÃO EDITE — REGENERADO A CADA INICIALIZAÇÃO.
#
# Todos os online neste servidor; cada um abre os seus baús. /pvadmin
#
# Cada jogador: %player_name% %player_id%

title: "{primary}&lBAÚS DOS JOGADORES {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}Não há mais jogadores"
    lore:
      - ""
      - " {letters_black}▎ {letters}Os jogadores online aqui aparecem aqui."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "playerhead-%player_name%"
    name: "{primary}&l%player_name%"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Veja, edite, esvazie ou restaure"
      - " {letters_black}▎ {letters}qualquer um dos seus baús."
      - ""
      - "{warning}➥ Clique para abrir"
      - ""
    actions:
      - "exyliaplayervaults:list %player_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← PÁGINA ANTERIOR"
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lPRÓXIMA PÁGINA →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Página {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  info:
    slot: 49
    material: COMPASS
    name: "{primary}&lOUTROS JOGADORES"
    lore:
      - ""
      - "{secondary}Informação:"
      - " {letters_black}▎ {letters}Offline ou em outro servidor?"
      - " {letters_black}▎ {letters}Abra os baús de qualquer um com:"
      - " {letters_black}▎ {highlight}/pvadmin list <player>"
      - ""
