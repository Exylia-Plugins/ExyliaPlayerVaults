prefix: '{primary}&lBAÚS {letters_black}•<reset>'
title: '{primary}&lBAÚ {letters_black}» {highlight}%name%'
admin-title: '{primary}&lBAÚ {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
view-title: '{primary}&lVER {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
snapshot-title: '{primary}&lCÓPIA {letters_black}» {highlight}%player% {letters_black}#{highlight}%number%'
default-name: '#%number%'
in-use: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Esse baú está aberto em outro lugar agora. Tente de novo em instantes.'
not-unlocked: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Você não tem o baú {highlight}%number%{error}.'
unreadable: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Não foi possível ler esse baú. Nada foi perdido; tente de novo.'
blocked-item: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Esse item não pode ir para um baú.'
lock-lost: '%prefix% {warning}O baú {highlight}%number% {warning}foi salvo e fechado após uma falha de conexão. {letters}Abra de novo para continuar.'
taken-over: '%prefix% {warning}O baú {highlight}%number% {warning}foi salvo e fechado porque um membro da staff está olhando o conteúdo.'
taking-over: '%prefix% {letters}O baú {highlight}%number% {letters}estava aberto em outro servidor; está sendo salvo e fechado.'
hidden-stacks: '%prefix% {warning}%count% {letters}pilha(s) deste baú ficam ocultas até ele voltar a ter mais linhas.'
returned: '%prefix% {warning}%count% {letters}pilha(s) não cabem mais no baú {highlight}%number% {letters}e foram devolvidas a você.'
rewards-delivered: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}%amount% {letters}item(ns) dos seus baús foram devolvidos a você.'
cooldown: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Espere {highlight}%time% ⌚ {error}antes de abrir outro baú.'
in-combat: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Você não pode abrir um baú em combate.'
disabled-world: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Baús não podem ser abertos neste mundo.'
disabled-game-mode: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Baús não podem ser abertos neste modo de jogo.'
rename-prompt: '{primary}Nome do baú %number% {letters_black}(- para redefinir)'
name-invalid: '{error}Apenas letras, números, espaços e - _ '' . ! ? # ( ).'
renamed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}O baú {highlight}%number% {letters}agora se chama {highlight}%name%{letters}.'
rename-reset: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}O baú {highlight}%number% {letters}voltou ao nome original.'
icon-prompt: '{primary}Escolha um ícone para o baú %number%'
icon-changed: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}O baú {highlight}%number% {letters}tem um ícone novo.'
no-permission: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Você não tem permissão para fazer isso.'
buy-prompt: '{primary}Comprar o baú %number% por %price%?'
bought: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}O baú {highlight}%number% {success}é seu. {letters}Você pagou {highlight}%price%{letters}.'
buy-too-poor: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Você precisa de {highlight}%price% {error}para comprar esse baú.'
buy-limit: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Você não pode comprar mais baús.'
buy-disabled: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Não é possível comprar baús neste servidor.'
buy-failed: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}A compra não foi concluída e você não foi cobrado. Tente de novo.'
search-header: '%prefix% {letters}Encontrado {highlight}%amount% {letters}de {highlight}%query% {letters}nos seus baús:'
search-line: ' {letters_black}▎ {letters}%name% {letters_black}» {info}%amount%'
search-none: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Nenhum dos seus baús tem {highlight}%query%{error}.'
admin-usage:
  - '%prefix% {letters}Uso{letters_black}:'
  - ' {letters_black}▎ {highlight}/pvadmin list <player>'
  - ' {letters_black}▎ {highlight}/pvadmin view <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin edit <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin history <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin clear <player> <number>'
  - ' {letters_black}▎ {highlight}/pvadmin reload'
clear-prompt: '{error}Esvaziar o baú %number% de %player%?'
cleared: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}O baú {highlight}%number% {letters}de {highlight}%player% {letters}foi esvaziado. {letters_black}O conteúdo está no histórico.'
restore-prompt: '{warning}Deixar o baú %number% de %player% como estava %when%?'
restored: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {letters}O baú {highlight}%number% {letters}de {highlight}%player% {letters}voltou a ficar como estava {highlight}%when%{letters}.'
history-empty: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}O baú {highlight}%number% {error}de {highlight}%player% {error}ainda não tem histórico.'
snapshot-missing: '[sound:ENTITY_VILLAGER_NO|1.0|1.0]%prefix% {error}Essa cópia não está mais no histórico.'
reloaded: '[sound:ENTITY_EXPERIENCE_ORB_PICKUP|1.0|1.2]%prefix% {success}Configuração, mensagens e menus recarregados.'
