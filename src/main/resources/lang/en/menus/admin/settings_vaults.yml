    name: "{letters}Vaults {letters_black}▸ <gradient:{primary}:{secondary_light}>Blocked items</gradient>"
    lore:
      - "{letters_black}Vaults setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}Items that cannot be put into"
      - " {letters}a vault. Shulker boxes and"
      - " {letters}bundles holding one are refused."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Items{letters_black}: %vaults_vaults_blocked_materials%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %vaults_vaults_blocked_materials_default%"
