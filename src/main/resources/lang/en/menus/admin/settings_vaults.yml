# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# The vault settings an admin tunes. Everything else is in config.yml.

title: "{primary}&lSETTINGS {letters_black}» {highlight}Vaults"
size: 27
type: SIMPLE

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true

items:
  header:
    slot: 4
    material: BARREL
    name: "<gradient:{primary}:{secondary_light}>Vaults</gradient>"
    lore:
      - "{letters_black}Vaults settings"
      - ""
      - "{primary}✎ Information"
      - " {letters}How many vaults a player has,"
      - " {letters}how big they are and what"
      - " {letters}they may hold."

  vaults-default-amount:
    slot: 10
    material: BARREL
    name: "{letters}Vaults {letters_black}▸ <gradient:{primary}:{secondary_light}>Default vaults</gradient>"
    lore:
      - "{letters_black}Vaults setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How many vaults a player has"
      - " {letters}with no permission of their own."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:hopper} {letters}Vaults{letters_black}: %vaults_vaults_default_amount%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %vaults_vaults_default_amount_default%"
      - ""
      - "%vaults_vaults_default_amount_click%"
    actions:
      - "exyliaplayervaults:setting vaults vaults.default-amount"

  vaults-max-amount:
    slot: 11
    material: CHEST
    name: "{letters}Vaults {letters_black}▸ <gradient:{primary}:{secondary_light}>Vault cap</gradient>"
    lore:
      - "{letters_black}Vaults setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}The most vaults anybody may have,"
      - " {letters}bought ones included."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:hopper} {letters}Cap{letters_black}: %vaults_vaults_max_amount%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %vaults_vaults_max_amount_default%"
      - ""
      - "%vaults_vaults_max_amount_click%"
    actions:
      - "exyliaplayervaults:setting vaults vaults.max-amount"

  vaults-default-rows:
    slot: 12
    material: LADDER
    name: "{letters}Vaults {letters_black}▸ <gradient:{primary}:{secondary_light}>Default rows</gradient>"
    lore:
      - "{letters_black}Vaults setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}How many rows (1 to 6) a vault"
      - " {letters}has by default."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Rows{letters_black}: %vaults_vaults_default_rows%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %vaults_vaults_default_rows_default%"
      - ""
      - "%vaults_vaults_default_rows_click%"
    actions:
      - "exyliaplayervaults:setting vaults vaults.default-rows"

  vaults-hidden-slots:
    slot: 13
    material: ENDER_CHEST
    name: "{letters}Vaults {letters_black}▸ <gradient:{primary}:{secondary_light}>Hidden slots</gradient>"
    lore:
      - "{letters_black}Vaults setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}What happens to items a smaller"
      - " {letters}vault can no longer show: kept"
      - " {letters}out of sight or handed back."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Mode{letters_black}: %vaults_vaults_hidden_slots%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %vaults_vaults_hidden_slots_default%"
