      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Copies{letters_black}: %vaults_history_keep%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %vaults_history_keep_default%"
      - ""
      - "%vaults_history_keep_click%"
    actions:
      - "exyliaplayervaults:setting vaults history.keep"

  customization-name-max-length:
    slot: 16
    material: NAME_TAG
    name: "{letters}Vaults {letters_black}▸ <gradient:{primary}:{secondary_light}>Name length</gradient>"
    lore:
      - "{letters_black}Vaults setting"
      - ""
      - "{primary}✎ Information"
      - " {letters}The longest name a player may"
      - " {letters}give a vault, before ranks."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:book} {letters}Length{letters_black}: %vaults_customization_name_max_length%"
      - "  {letters_black}· {info}{icon:book} {letters}Default{letters_black}: %vaults_customization_name_max_length_default%"
      - ""
      - "%vaults_customization_name_max_length_click%"
    actions:
      - "exyliaplayervaults:setting vaults customization.name-max-length"

  back:
    slot: 22
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: 'basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0='
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Settings</gradient>"
    lore:
