# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Earlier copies of one vault, newest first. /pvadmin history <player> <number>
#
# Values: %owner_name% %vault_number% %history_size%
# Each copy: %snapshot_id% %snapshot_date% %snapshot_when% %snapshot_cause%
#            %snapshot_actor% %snapshot_used%

title: "{primary}&lHISTORY {letters_black}» {highlight}%owner_name% #%vault_number% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more copies"
    lore:
      - "{letters_black}A copy is kept each time the vault changes."
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{letters}Copy {letters_black}▸ <gradient:{primary}:{secondary_light}>%snapshot_when%</gradient> &8[{info}%snapshot_used%&8]"
    lore:
      - "{letters_black}Vault copy"
      - ""
      - "{primary}✎ Information"
      - " {letters}What the vault held before it was"
      - " {highlight}%snapshot_cause% {letters}by {highlight}%snapshot_actor%{letters}."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {info}{icon:clock} {letters}Date{letters_black}: {info}%snapshot_date%"
      - "  {letters_black}· {info}{icon:iron} {letters}Stacks{letters_black}: {info}%snapshot_used%"
      - ""
      - "{primary}» Left-click {letters_black}· {letters}look inside"
      - "{error}» Shift-right-click {letters_black}· {letters}put this copy back"
      - "{letters_black}You will be asked to confirm."
    actions:
      - "left: exyliaplayervaults:snapshot_view %snapshot_id%"
      - "shift_right: exyliaplayervaults:snapshot_restore %snapshot_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{error}:{error_light}>← Previous</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{letters}Page {letters_black}▸ <gradient:{success}:{success_light}>Next →</gradient>"
      lore:
        - "  {letters_black}· {letters}Page{letters_black}: {info}%current_page%{letters_black}/{info}%total_pages%"
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: BARREL
    name: "<gradient:{primary}:{secondary_light}>Vault #%vault_number%</gradient>"
    lore:
      - "{letters_black}Vault history"
      - ""
      - "{primary}✎ Information"
      - " {letters}Putting a copy back keeps the"
      - " {letters}current contents as a new copy."
      - ""
      - "{primary}✦ Status"
      - "  {letters_black}· {highlight}{icon:tag} {letters}Owner{letters_black}: {highlight}%owner_name%"
      - "  {letters_black}· {info}{icon:book} {letters}Copies{letters_black}: {info}%history_size%"
