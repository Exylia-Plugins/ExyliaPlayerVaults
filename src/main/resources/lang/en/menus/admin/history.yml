# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Earlier copies of one vault, newest first. /pvadmin history <player> <number>
#
# Values: %owner_name% %vault_number% %history_size%
# Each copy: %snapshot_id% %snapshot_date% %snapshot_when% %snapshot_cause%
#            %snapshot_actor% %snapshot_used%

title: "{primary}&lHISTORY {letters_black}» {highlight}%owner_name% #%vault_number% {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more copies"
    lore:
      - ""
      - " {letters_black}▎ {letters}A copy is kept each time the vault changes."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: CHEST
    name: "{primary}&lCOPY {highlight}%snapshot_when% &8[{info}%snapshot_used%&8]"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}What the vault held before it was"
      - " {letters_black}▎ {highlight}%snapshot_cause% {letters}by {highlight}%snapshot_actor%{letters}."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Date {letters_black}» {info}%snapshot_date%"
      - " {letters_black}▎ {letters}Stacks {letters_black}» {info}%snapshot_used%"
      - ""
      - "{warning}➥ Left-click {letters_black}» {letters}look inside"
      - "{error}➥ Shift-right-click {letters_black}» {letters}put this copy back"
      - " {letters_black}You will be asked to confirm."
      - ""
    actions:
      - "left: exyliaplayervaults:snapshot_view %snapshot_id%"
      - "shift_right: exyliaplayervaults:snapshot_restore %snapshot_id%"

  navigation:
    previous:
      slot: 48
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
      name: "{error}&l← PREVIOUS PAGE"
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "previous_page"
    next:
      slot: 50
      sound: "minecraft:item.book.page_turn|1.0|1.0"
      material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
      name: "{success}&lNEXT PAGE →"
      lore:
        - ""
        - " {letters_black}▎ {letters}Page {info}%current_page%{letters_black}/{info}%total_pages%"
        - ""
      actions:
        - "next_page"

items:
  header:
    slot: 49
    material: BARREL
    name: "{primary}&lVAULT {highlight}#%vault_number%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Owner {letters_black}» {highlight}%owner_name%"
      - " {letters_black}▎ {letters}Putting a copy back keeps the"
      - " {letters_black}▎ {letters}current contents as a new copy."
      - ""
      - "{secondary}Status:"
      - " {letters_black}▎ {letters}Copies {letters_black}» {info}%history_size%"
      - ""
