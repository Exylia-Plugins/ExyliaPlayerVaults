# DO NOT EDIT — REGENERATED ON EVERY STARTUP.
#
# Everybody online on this server; each opens their vaults. /pvadmin
#
# Each player: %player_name% %player_id%

title: "{primary}&lPLAYER VAULTS {muted}%current_page%/%total_pages%"
size: 54
type: PAGINATION

open_sounds:
  - "minecraft:block.ender_chest.open|1.0|1.4"
click_sounds:
  - "minecraft:block.note_block.hat|1.0|1.0"
close_sounds:
  - "minecraft:block.barrel.close|1.0|0.7"

filler:
  global:
    material: GRAY_STAINED_GLASS_PANE
    hide_tooltip: true
  pagination:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: "{muted}No more players"
    lore:
      - ""
      - " {letters_black}▎ {letters}Players online here show up here."
      - ""
    hide_tooltip: false

pagination:
  slots: '0-35'

  item_template:
    material: "playerhead-%player_name%"
    name: "{primary}&l%player_name%"
    lore:
      - ""
      - "{secondary}Information:"
      - " {letters_black}▎ {letters}Look at, edit, clear or restore"
      - " {letters_black}▎ {letters}any of their vaults."
      - ""
      - "{warning}➥ Click to open"
      - ""
    actions:
      - "exyliaplayervaults:list %player_id%"

  navigation:
