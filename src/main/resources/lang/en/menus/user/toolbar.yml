# The row of buttons under a vault, shown when vaults.toolbar is on in config.yml.
#
# Yours to restyle: edits are kept across updates.
#
# Each button sits on a column of the row (slot 0 to 8); columns without one
# show the filler. Buttons are ordinary items plus menu-style actions
# (left:, right:, shift_left:...). A click closes the vault first, unless
# every action of that click only opens another vault, which swaps the window.
# "previous" and "next" show their muted item when there is no vault that way.
#
# Values: %vault_owner% %vault_number% %vault_name% %previous_number%
#         %next_number% %vaults_unlocked%

menu-version: 1

filler:
  material: GRAY_STAINED_GLASS_PANE
  hide_tooltip: true

buttons:
  search:
    slot: 1
    material: SPYGLASS
    name: "{letters}Vaults {letters_black}▸ <gradient:{info}:{info_light}>Search</gradient>"
    lore:
      - "{letters_black}Vault search"
      - ""
      - "{info}✎ Information"
      - " {letters}Find which vault holds an item,"
      - " {letters}shulker boxes and bundles included."
      - ""
      - "{info}{icon:click} Click to search"
      - "{letters_black}Closes this vault first."
    actions:
      - "exyliaplayervaults:search %vault_owner%"

  previous:
    slot: 3
    sound: "minecraft:item.book.page_turn|1.0|1.0"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGExZDU1YjNmOTg5NDEwYTM0NzUyNjUwZTI0OGM5YjZjMTc4M2E3ZWMyYWEzZmQ3Nzg3YmRjNGQwZTYzN2QzOSJ9fX0="
    name: "{letters}Vault {letters_black}▸ <gradient:{info}:{info_light}>← #%previous_number%</gradient>"
    lore:
      - "  {letters_black}· {letters}Vault{letters_black}: {info}%vault_number%{letters_black}/{info}%vaults_unlocked%"
      - ""
      - "{info}{icon:click} Click to open"
      - "{letters_black}Saves this vault, then opens it."
    muted:
      material: GRAY_DYE
      name: "{muted}No previous vault"
      lore:
        - "{letters_black}This is your first vault."
    actions:
      - "exyliaplayervaults:open %vault_owner% %previous_number%"

  list:
    slot: 4
    sound: "minecraft:item.bundle.remove_one|1.0|0.5"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjIzZmI2NzQyOTcxNmIyMWJjNmU4ZTdkNjY5Y2VkZGY2NWIxM2UwNzkwYTVjZTU1YjJlMDc3YjgyZDE5ZTEyNCJ9fX0="
    name: "{letters}Back {letters_black}▸ <gradient:{error}:{error_light}>Vaults</gradient>"
    lore:
      - "{error}{icon:click} Click to go back"
      - "{letters_black}Every vault you have."
    actions:
      - "exyliaplayervaults:list %vault_owner%"

  next:
    slot: 5
    sound: "minecraft:item.book.page_turn|1.0|1.0"
    material: "basehead-eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZmE4N2UzZDk2ZTFjZmViOWNjZmIzYmE1M2EyMTdmYWY1MjQ5ZTI4NTUzM2IyNzFhMmZiMjg0YzMwZGJkOTgyOSJ9fX0="
    name: "{letters}Vault {letters_black}▸ <gradient:{info}:{info_light}>#%next_number% →</gradient>"
    lore:
      - "  {letters_black}· {letters}Vault{letters_black}: {info}%vault_number%{letters_black}/{info}%vaults_unlocked%"
      - ""
      - "{info}{icon:click} Click to open"
      - "{letters_black}Saves this vault, then opens it."
    muted:
      material: GRAY_DYE
      name: "{muted}No next vault"
      lore:
        - "{letters_black}A higher rank unlocks more."
    actions:
      - "exyliaplayervaults:open %vault_owner% %next_number%"

  customize:
    slot: 7
    material: NAME_TAG
    name: "{letters}Vault {letters_black}▸ <gradient:{primary}:{secondary_light}>%vault_name%</gradient>"
    lore:
      - "{letters_black}Vault look"
      - ""
      - "{primary}✎ Information"
      - " {letters}The name and icon this vault"
      - " {letters}shows in your list."
      - ""
      - "{primary}{icon:click} Left-click {letters_black}· {letters}rename"
      - "{primary}{icon:right_click} Right-click {letters_black}· {letters}change icon"
      - "{letters_black}Closes this vault first."
    actions:
      - "left: exyliaplayervaults:rename %vault_owner% %vault_number%"
      - "right: exyliaplayervaults:icon %vault_owner% %vault_number%"
